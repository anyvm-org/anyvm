
name: Windows

on:
  workflow_dispatch:
  push:
    branches:
      - '*'
    paths:
      - '**.py'
      - '.github/workflows/testwindows.yml'
      - '.github/workflows/testrun.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    # Guest filtering ([testos=...]) happens per-leg in testrun.yml -- the
    # os here is a matrix axis. This gate is the host half only.
    if: >-
      ${{ github.event_name != 'push'
          || !contains(github.event.head_commit.message, '[testhost=')
          || contains(github.event.head_commit.message, '[testhost=win') }}
    strategy:
      fail-fast: false
      matrix:
        os: ["freebsd", "hardenedbsd", "ghostbsd", "haiku", "midnightbsd", "nextbsd", "netbsd", "openbsd", "solaris", "dragonflybsd", "omnios", "openindiana", "tribblix", "ubuntu", "debian", "openeuler", "alpine", "hurd"]
        arch: [""]
        runs: ["windows-latest"]
        sync: ["scp", "rsync", "nfs", "tar"]
        exclude:
          - os: solaris
            arch: aarch64
          - os: dragonflybsd
            arch: aarch64
          - os: omnios
            arch: aarch64
          - os: openindiana
            arch: aarch64
          - os: tribblix
            arch: aarch64
        include:
          # haiku needs non-default inputs, carried as matrix data the same
          # way test.yml does it: its "/" holds directories and symlinks but
          # NOT regular files, so the share has to land on the real BFS
          # volume, and the guest account is "user" (root cannot log in).
          # The guest runs under TCG here and boots slowly, so it also gets
          # the pause between ssh probes that haiku.yml used when it still
          # ran this host itself (commit 54949d5).
          - os: haiku
            user: user
            vmpath: /boot/home/host
            sleep: "sleep 10;"

    uses: ./.github/workflows/testrun.yml
    secrets: inherit
    with:
      runs: ${{ matrix.runs }}
      os: ${{ matrix.os }}
      arch: ${{ matrix.arch }}
      sync: ${{ matrix.sync }}
      user: ${{ matrix.user }}
      vmpath: ${{ matrix.vmpath }}
      sleep: ${{ matrix.sleep }}


  # Plan 9 (9front) has no sshd, so it cannot reuse the ssh-based
  # testrun.yml. Verify boot + telnet exec on the Windows host (WHPX/TCG).
  # NOTE: 9P folder sync is NOT tested here -- it needs the Linux kernel v9fs
  # client (mount -t 9p), which does not exist on Windows, so a plan9 -v sync
  # is a Linux-host-only feature. The full boot + telnet + 9P-sync path is
  # covered on Linux by plan9.yml. Here we only prove anyvm can boot and drive
  # a plan9 guest on a Windows host.
  plan9:
    if: >-
      ${{ github.event_name != 'push'
          || (
               ( !contains(github.event.head_commit.message, '[testos=')
                 || contains(github.event.head_commit.message, '[testos=plan9]') )
            && ( !contains(github.event.head_commit.message, '[testhost=')
                 || contains(github.event.head_commit.message, '[testhost=win') )
             ) }}
    runs-on: windows-latest
    name: Test plan9 telnet
    env:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
    steps:
    - uses: actions/checkout@v7
    - name: Install dependencies
      shell: bash
      run: |
        for i in 1 2 3; do
          choco install -y --no-progress qemu zstandard && exit 0
          echo "Attempt $i failed, sleeping 15s..."
          sleep 15
        done
        exit 1
    - name: Boot 9front and verify telnet exec
      shell: bash
      run: |
        set -e
        mkdir -p ../test_output
        python anyvm.py --debug --data-dir ../test_output --os plan9 \
          --ssh-port 10023 -d
        echo "===============verify telnet exec"
        python - <<'PY'
        import socket, sys, time
        def telnet_exec(port, cmds, settle=4.0):
            IAC=255; SE=240; SB=250; WILL,WONT,DO,DONT=251,252,253,254
            out=bytearray()
            s=socket.create_connection(("127.0.0.1",port),15)
            def eat(data):
                i=0;n=len(data)
                while i<n:
                    b=data[i]
                    if b!=IAC: out.append(b); i+=1; continue
                    if i+1>=n: break
                    c=data[i+1]
                    if c in (DO,DONT,WILL,WONT) and i+2<n:
                        o=data[i+2]
                        if c==DO: s.sendall(bytes([IAC,WONT,o]))
                        elif c==WILL: s.sendall(bytes([IAC,DONT,o]))
                        i+=3
                    elif c==SB:
                        j=i+2
                        while j+1<n and not (data[j]==IAC and data[j+1]==SE): j+=1
                        i=j+2
                    else: i+=2
            def rd(sec):
                end=time.time()+sec; s.settimeout(0.5)
                while time.time()<end:
                    try: d=s.recv(4096)
                    except socket.timeout: continue
                    if not d: return
                    eat(d)
            rd(min(settle,2))
            for c in cmds:
                s.sendall(c.encode()+b"\r\n"); rd(settle)
            s.close(); return out.decode("utf-8","replace")
        txt=""
        for _ in range(40):
            try:
                txt=telnet_exec(10023, ["echo EXEC''-OK", "cat /dev/user"])
                if "EXEC-OK" in txt: break
            except OSError: time.sleep(5)
        print(txt)
        assert "EXEC-OK" in txt, "telnet exec failed"
        print("plan9 verify OK: telnet exec (9P sync is Linux-only, see plan9.yml)")
        PY


  # ReactOS has no sshd either -- it is driven over the telnet server
  # reactos-builder bakes into the image, so it cannot reuse testrun.yml.
  # Unlike plan9, its folder sync IS tested here: --sync tar streams a ustar
  # archive over that same telnet channel, so it needs nothing from the host
  # kernel and must work from a Windows host exactly as it does from Linux.
  reactos:
    if: >-
      ${{ github.event_name != 'push'
          || (
               ( !contains(github.event.head_commit.message, '[testos=')
                 || contains(github.event.head_commit.message, '[testos=reactos]') )
            && ( !contains(github.event.head_commit.message, '[testhost=')
                 || contains(github.event.head_commit.message, '[testhost=win') )
             ) }}
    runs-on: windows-latest
    name: Test reactos tar
    # WHPX carries this leg (an i386 guest is accelerated on an x86_64 host
    # exactly like an x86_64 one); the bound is only a wedge backstop.
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
    steps:
    - uses: actions/checkout@v7
    - name: Install dependencies
      shell: bash
      run: |
        for i in 1 2 3; do
          choco install -y --no-progress qemu zstandard && exit 0
          echo "Attempt $i failed, sleeping 15s..."
          sleep 15
        done
        exit 1
    - name: Boot ReactOS and verify telnet exec + tar sync
      shell: bash
      run: |
        set -e
        mountdir=test
        mkdir -p ${mountdir}
        echo "anyvm" > ${mountdir}/justcheck.txt
        mkdir -p ../test_output
        # WHPX reaches this guest only through the 64-bit QEMU binary (the
        # i386 one is built without it); anyvm switches binaries itself and
        # says so in its output. Measured on a bare-metal Windows host after
        # anyvm stopped passing -rtc driftfix=slew for this guest: 35 s to a
        # telnet prompt. The raised timeout is headroom for a nested runner.
        python anyvm.py --debug --data-dir ../test_output --os reactos \
          --arch i386 --ssh-port 10023 -d --boot-timeout-sec 1500 \
          --sync tar -v "${mountdir}:C:\work"
        echo "===============verify telnet exec + tar-synced marker"
        python - <<'PY'
        import socket, sys, time
        def telnet_exec(port, cmds, settle=4.0):
            IAC=255; SE=240; SB=250; WILL,WONT,DO,DONT=251,252,253,254
            out=bytearray()
            s=socket.create_connection(("127.0.0.1",port),15)
            def eat(data):
                i=0;n=len(data)
                while i<n:
                    b=data[i]
                    if b!=IAC: out.append(b); i+=1; continue
                    if i+1>=n: break
                    c=data[i+1]
                    if c in (DO,DONT,WILL,WONT) and i+2<n:
                        o=data[i+2]
                        if c==DO: s.sendall(bytes([IAC,WONT,o]))
                        elif c==WILL: s.sendall(bytes([IAC,DONT,o]))
                        i+=3
                    elif c==SB:
                        j=i+2
                        while j+1<n and not (data[j]==IAC and data[j+1]==SE): j+=1
                        i=j+2
                    else: i+=2
            def rd(sec):
                end=time.time()+sec; s.settimeout(0.5)
                while time.time()<end:
                    try: d=s.recv(4096)
                    except socket.timeout: continue
                    if not d: return
                    eat(d)
            rd(min(settle,2))
            for c in cmds:
                s.sendall(c.encode()+b"\r\n"); rd(settle)
            s.close(); return out.decode("utf-8","replace")
        # cmd.exe on the far side: "^" escapes the next character, so only
        # the command's OUTPUT carries the bare marker.
        txt=""
        for _ in range(40):
            try:
                txt=telnet_exec(10023, ["echo EXEC^-OK", "dir C:\\work"])
                if "EXEC-OK" in txt: break
            except OSError: time.sleep(5)
        print(txt)
        assert "EXEC-OK" in txt, "telnet exec failed"
        assert "justcheck.txt" in txt, "tar-synced file not visible in guest"
        print("reactos verify OK: telnet exec + tar sync")
        PY



