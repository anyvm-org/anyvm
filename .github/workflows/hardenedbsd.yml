
name: HardenedBSD

on:
  workflow_dispatch:
  push:
    branches:
      - '*'
    paths:
      - '**.py'
      - '.github/workflows/hardenedbsd.yml'
      - '.github/workflows/testrun.yml'



concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Coverage tracks hardenedbsd-builder v2.0.0 (ALL_RELEASES = 15), amd64 only
# (HardenedBSD builds no other arch). Release 15 follows upstream's rolling
# 15-STABLE LATEST build. The conf's VM_SYNC_METHODS is
# rsync,scp,sshfs,nfs,tar (rsync + fusefs-sshfs pre-installed), so all five
# backends are exercised. Release 14 exists as a conf but is shelved:
# upstream retired the 14-STABLE package repository, so it is not built.
jobs:
  test:
    if: >-
      ${{ github.event_name != 'push'
          || (
               ( !contains(github.event.head_commit.message, '[testos=')
                 || contains(github.event.head_commit.message, '[testos=hardenedbsd]') )
            && ( !contains(github.event.head_commit.message, '[testhost=')
                 || contains(github.event.head_commit.message, '[testhost=linux') )
             ) }}
    strategy:
      fail-fast: false
      matrix:
        release: ["15"]
        arch: [""]
        runs: ["ubuntu-24.04"]
        sync: ["sshfs", "nfs", "scp", "rsync", "tar"]


    uses: ./.github/workflows/testrun.yml
    secrets: inherit
    with:
      runs: ${{ matrix.runs }}
      os: hardenedbsd
      release: ${{ matrix.release }}
      arch: ${{ matrix.arch }}
      sync: ${{ matrix.sync }}
