
name: HardenedBSD

on:
  workflow_dispatch:
  push:
    branches:
      - '*'
    paths:
      - '**.py'
      - '.github/workflows/hardenedbsd.yml'
      - '.github/workflows/testrun.yml'



concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Coverage tracks hardenedbsd-builder v2.0.1 (ALL_RELEASES = 15), amd64 only
# (HardenedBSD builds no other arch). Release 15 follows upstream's rolling
# 15-STABLE LATEST build. The conf's VM_SYNC_METHODS is
# rsync,scp,sshfs,nfs,tar (rsync + fusefs-sshfs pre-installed), so all five
# backends are exercised. v2.0.1 bakes fusefs_load="YES" into loader.conf --
# HardenedBSD's hardening rejects runtime kldload, so the v2.0.0 image could
# never sshfs at all. Release 14 exists as a conf but is shelved: upstream
# retired the 14-STABLE package repository, so it is not built.
#
# On a TCG host (the arm64 macOS runner, where an x86_64 guest cannot be
# accelerated) anyvm masks la57 for this guest. -cpu max turns on 5-level
# paging, and HardenedBSD's PaX-ASLR userland cannot survive a 57-bit
# address space: ldconfig, dhclient, mktemp and gpart all SIGSEGV, sshd's
# precmd dies with it, and the boot probe times out. FreeBSD 15 on the same
# runner, same QEMU and same accel=tcg passes all four legs, so this is
# HardenedBSD-specific rather than a TCG-wide problem. See the la57 block in
# anyvm.py for the model-by-model bisect. These macOS legs had never been
# green -- they failed the first time they ran (2026-08-24) and every run in
# between was gated away by a [testos=] marker, so nothing reported it.
jobs:
  test:
    if: >-
      ${{ github.event_name != 'push'
          || (
               ( !contains(github.event.head_commit.message, '[testos=')
                 || contains(github.event.head_commit.message, '[testos=hardenedbsd]') )
            && ( !contains(github.event.head_commit.message, '[testhost=')
                 || contains(github.event.head_commit.message, '[testhost=linux') )
             ) }}
    strategy:
      fail-fast: false
      matrix:
        release: ["15"]
        arch: [""]
        runs: ["ubuntu-24.04"]
        sync: ["sshfs", "nfs", "scp", "rsync", "tar"]


    uses: ./.github/workflows/testrun.yml
    secrets: inherit
    with:
      runs: ${{ matrix.runs }}
      os: hardenedbsd
      release: ${{ matrix.release }}
      arch: ${{ matrix.arch }}
      sync: ${{ matrix.sync }}
