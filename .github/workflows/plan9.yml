name: Plan 9

on:
  workflow_dispatch:
  push:
    branches:
      - '*'
    paths:
      - '**.py'
      - '.github/workflows/plan9.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Plan 9 (9front) has no sshd, so it cannot reuse the ssh-based testrun.yml.
# It is driven over telnetd (control channel) and its exportfs 9P share
# (folder sync). This standalone job boots the published image with anyvm,
# then verifies BOTH channels with a small python telnet client:
#   1. exec: run `echo` in the guest and read the marker back
#   2. 9p sync: a host file placed via `--sync 9p -v` shows up in the guest
jobs:
  test:
    if: >-
      ${{ github.event_name != 'push'
          || (
               ( !contains(github.event.head_commit.message, '[testos=')
                 || contains(github.event.head_commit.message, '[testos=plan9]') )
            && ( !contains(github.event.head_commit.message, '[testhost=')
                 || contains(github.event.head_commit.message, '[testhost=linux') )
             ) }}
    strategy:
      fail-fast: false
      matrix:
        release: ["11554", "11952"]
        runs: ["ubuntu-24.04"]
    runs-on: ${{ matrix.runs }}
    name: Test ${{ matrix.release }}
    # 9front boots in well under a minute with KVM; this only stops a wedged
    # boot or a stuck guest command from burning the 6 h default (a marker
    # bug once left the attach step waiting on its full exec timeout).
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
    steps:
    - uses: actions/checkout@v7
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get --no-install-recommends -y install \
          zstd qemu-utils qemu-system-x86 ca-certificates
    - name: Boot 9front and verify telnet exec + 9P sync
      shell: bash
      run: |
        set -e
        mountdir=test
        mkdir -p ${mountdir}
        echo "anyvm" > ${mountdir}/justcheck.txt
        # A REAL payload, not one file. Every count-dependent defect this
        # transport has had was invisible at toy scale and only appeared once
        # a genuine workspace went through: the agent dropping bytes on a full
        # pipe, the pull's flat silence budget expiring before the guest's
        # directory walk produced its first byte, harness files nobody
        # excluded. One file exercises none of that, so this job ships 500
        # files plus a 1.0 MB blob and checksums the whole tree back at the
        # end. Keep it: a green run over a single file proves very little.
        for i in $(seq 1 500); do
          head -c 2048 /dev/urandom | base64 > ${mountdir}/f$i.txt
        done
        head -c 1000000 /dev/urandom > ${mountdir}/blob.bin
        ( cd ${mountdir} && find . -type f | sort | xargs md5sum ) > /tmp/manifest.before
        echo "payload: $(find ${mountdir} -type f | wc -l) files, $(du -sk ${mountdir} | cut -f1) KB"
        mkdir -p ../test_output
        # Boot detached: anyvm returns leaving QEMU running, after wiring the
        # telnet control forward (host 10023 -> guest 23) and syncing the
        # shared folder over 9P into /usr/glenda/work.
        # --p9-port pins the 9P forward so the copy-back step below (a
        # separate anyvm process) can reopen the same channel; without it the
        # port is chosen at random and is unknowable from outside this run.
        python anyvm.py --debug --data-dir ../test_output --os plan9 \
          --release "${{ matrix.release }}" --ssh-port 10023 --p9-port 20564 -d \
          --sync 9p -v "${mountdir}:/usr/glenda/work"
        echo "===============verify telnet exec + 9P-synced marker"
        python3 - <<'PY'
        import socket, sys, time
        def telnet_exec(port, cmds, settle=4.0):
            IAC=255; SE=240; SB=250; WILL,WONT,DO,DONT=251,252,253,254
            out=bytearray()
            s=socket.create_connection(("127.0.0.1",port),15)
            def eat(data):
                i=0;n=len(data)
                while i<n:
                    b=data[i]
                    if b!=IAC: out.append(b); i+=1; continue
                    if i+1>=n: break
                    c=data[i+1]
                    if c in (DO,DONT,WILL,WONT) and i+2<n:
                        o=data[i+2]
                        if c==DO: s.sendall(bytes([IAC,WONT,o]))
                        elif c==WILL: s.sendall(bytes([IAC,DONT,o]))
                        i+=3
                    elif c==SB:
                        j=i+2
                        while j+1<n and not (data[j]==IAC and data[j+1]==SE): j+=1
                        i=j+2
                    else: i+=2
            def rd(sec):
                end=time.time()+sec; s.settimeout(0.5)
                while time.time()<end:
                    try: d=s.recv(4096)
                    except socket.timeout: continue
                    if not d: return
                    eat(d)
            rd(min(settle,2))
            for c in cmds:
                s.sendall(c.encode()+b"\r\n"); rd(settle)
            s.close(); return out.decode("utf-8","replace")
        # retry until telnetd answers (boot already waited, but be safe)
        txt=""
        for _ in range(20):
            try:
                txt=telnet_exec(10023, ["echo EXEC''-OK", "ls /usr/glenda/work"])
                if "EXEC-OK" in txt: break
            except OSError: time.sleep(3)
        print(txt)
        assert "EXEC-OK" in txt, "telnet exec failed"
        assert "justcheck.txt" in txt, "9P-synced file not visible in guest"
        print("plan9 verify OK: telnet exec + 9P sync")
        PY
    - name: Verify --attach exec status
      shell: bash
      run: |
        set -e
        # Succeeding guest command -> anyvm exits 0 (set -e enforces it).
        python anyvm.py --debug --os plan9 --attach --ssh-port 10023 --exec-timeout-sec 120 -- "echo hello"
        # Failing guest command -> rc's $status is non-empty, the || arm of
        # the marker chain runs, anyvm must exit nonzero.
        if python anyvm.py --debug --os plan9 --attach --ssh-port 10023 --exec-timeout-sec 120 -- "ls /no/such/path"; then
          echo "FAIL: failing guest command reported success"; exit 1
        fi
        echo "plan9 --attach exec status OK"
    - name: Verify 9P copy-back
      shell: bash
      run: |
        set -e
        # The 9P push is a one-shot copy through a mount that is unmounted
        # again, NOT a live share -- so a file written in the guest reaches
        # the host only through this copy-back. (It goes over 9P rather than
        # the telnet tar stream because `tar c` piped through 9front's pty
        # comes back corrupted.)
        python anyvm.py --debug --os plan9 --attach --ssh-port 10023 \
          --exec-timeout-sec 120 -- "echo pulled > /usr/glenda/work/fromguest.txt"
        [ -e test/fromguest.txt ] && { echo "FAIL: file on host before the pull"; exit 1; }
        python anyvm.py --debug --os plan9 --attach --ssh-port 10023 \
          --sync 9p --p9-port 20564 --pull-files -v "test:/usr/glenda/work"
        grep -q pulled test/fromguest.txt
        echo "plan9 9P copy-back OK"
    - name: Verify the real payload survived the round trip
      shell: bash
      run: |
        set -e
        # Compare CONTENT hashes as a set, not a name-by-name diff, for two
        # reasons: the steps above deliberately add a file inside the guest
        # (so the returned tree is a superset), and RISC OS swaps '.' and '/'
        # in leafnames, so a name-based comparison would fail there for a
        # correct transfer. Every hash that went in must still be present --
        # that is what catches a truncated or misaligned stream, which is how
        # the agent's partial-write bug looked from the outside: files that
        # exist and are wrong.
        ( cd test && find . -type f | sort | xargs md5sum )           | awk '{print $1}' | sort > /tmp/after.hashes
        awk '{print $1}' /tmp/manifest.before | sort > /tmp/before.hashes
        missing="$(comm -23 /tmp/before.hashes /tmp/after.hashes | wc -l)"
        echo "sent $(wc -l < /tmp/before.hashes) files, $missing did not come back intact"
        if [ "$missing" != "0" ]; then
          echo "FAIL: $missing of the pushed files are missing or corrupted after the round trip"
          exit 1
        fi
        echo "round trip OK"
