name: "Bump builder versions"

# Propagate human-cut anyvm-org/<os>-builder releases into this repo:
# DEFAULT_BUILDER_VERSIONS in anyvm.py, the per-OS test workflow
# matrices, and mirrored coverage.allow lines. See
# .github/bump_versions.py. Scheduled AFTER the *-vm sibling bots
# (their cron is 20:35) so one day's builder release lands everywhere
# the same day. coverage.yml independently re-checks the matrices this
# bot edits.

permissions:
  contents: write
  issues: write

on:
  schedule:
    - cron: '5 21 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.VM_TOKEN }}

      - name: Bump versions from builder releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git switch main || (git fetch --all && git checkout -b main origin/main)
          python3 .github/bump_versions.py \
            --landed-out "${RUNNER_TEMP}/landed.txt" \
            --notes-out "${RUNNER_TEMP}/notes.txt"

      # Runs even when the bump step failed: bump_versions.py works
      # per-OS, so one builder with a missing releases.json (rc=1, that
      # OS untouched) must not throw away another OS's finished bump --
      # the failure still fails the job and opens the issue below.
      # Note: VM_TOKEN must hold the `workflow` scope, since this commit
      # can modify .github/workflows/*.yml (it already pushes rendered
      # workflow files in the builder repos, which needs the same).
      - name: Commit and push changes
        if: ${{ !cancelled() }}
        run: |
          git config user.email "ghactions@anyvm.org"
          git config user.name "Bump.yml"
          git add anyvm.py .github/coverage.allow
          git add .github/workflows/*.yml
          if git diff --cached --quiet; then
            echo "Nothing to commit, skipping push"
          else
            # [testos=<os>] markers: this commit edits anyvm.py, whose
            # path triggers EVERY per-OS test workflow -- unmarked, one
            # bump would light up the full fleet matrix (hundreds of
            # jobs). Each workflow's own gate reads the markers and only
            # the bumped OSes run.
            msg="Bump builder versions"
            if [ -s "${RUNNER_TEMP}/landed.txt" ]; then
              while read -r os _; do
                msg="${msg} [testos=${os}]"
              done < "${RUNNER_TEMP}/landed.txt"
            fi
            echo "commit message: ${msg}"
            git commit -m "$msg"
            pushed=""
            for attempt in 1 2 3 4 5; do
              git pull --rebase --autostash
              if git push; then
                pushed=yes
                break
              fi
              echo "push rejected (attempt ${attempt}), retrying in ${attempt}s"
              sleep "${attempt}"
            done
            if [ -z "$pushed" ]; then
              echo "push still rejected after 5 attempts"
              exit 1
            fi
          fi

      # A silent success is a miss: the maintainer should hear which
      # DEFAULT_BUILDER_VERSIONS moved (and cut an anyvm release when
      # convenient so CLI users get the new pins). Deduped by exact
      # title; close the issue once reviewed.
      - name: Report a landed bump
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        run: |
          if [ ! -s "${RUNNER_TEMP}/landed.txt" ]; then
            echo "nothing landed, no notification"
            exit 0
          fi
          summary=$(paste -sd ', ' "${RUNNER_TEMP}/landed.txt")
          TITLE="version bump landed: ${summary}"
          export TITLE
          num=$(gh issue list --state open --limit 100 \
                  --json number,title \
                  --jq "[.[] | select(.title == env.TITLE)] | .[0].number // empty")
          if [ -n "$num" ]; then
            echo "issue #${num} already open for this change set"
            exit 0
          fi
          {
            echo "The anyvm version bump bot landed the following on main:"
            echo
            sed 's/^/- /' "${RUNNER_TEMP}/landed.txt"
            echo
            echo "Run: ${RUN_URL}"
            echo
            echo "The per-OS test matrices and coverage.allow were updated"
            echo "where applicable (see the commit). Cut an anyvm release"
            echo "when convenient so CLI users get the new default pins."
            # Matrix notes: what the bot assumed, and what it would not
            # add on its own. These used to stay in the run log, which is
            # how plan9 11952 sat unnoticed until coverage.yml caught it.
            if [ -s "${RUNNER_TEMP}/notes.txt" ]; then
              echo
              echo "Matrix notes -- confirm these by hand:"
              echo
              sed 's/^/- /' "${RUNNER_TEMP}/notes.txt"
            fi
            echo
            echo "Close this issue once reviewed."
          } > "${RUNNER_TEMP}/landed-issue.txt"
          gh issue create --title "${TITLE}" \
            --body-file "${RUNNER_TEMP}/landed-issue.txt"

      - name: Report a broken bump
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: "version bump: anyvm"
          RUN_URL: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        run: |
          num=$(gh issue list --state open --limit 100 \
                  --json number,title \
                  --jq "[.[] | select(.title == env.TITLE)] | .[0].number // empty")
          if [ -n "$num" ]; then
            echo "issue #${num} is already open"
            exit 0
          fi
          {
            echo "The anyvm version bump bot failed."
            echo
            echo "Run: ${RUN_URL}"
            echo
            echo "Likely causes: a new builder release without a"
            echo "releases.json asset, a release whose images are not all"
            echo "uploaded yet (its release build is still running or"
            echo "failed; the next run retries once it is green), a"
            echo "microvm image whose profile names a kernel the release"
            echo "does not carry, an unreadable builder repo, or a"
            echo "DEFAULT_BUILDER_VERSIONS line the rewriter did not"
            echo "recognize. The run log names the exact one."
            echo
            echo "This issue is not re-posted while it stays open. Close"
            echo "it once the bump succeeds to re-arm the report."
          } > "${RUNNER_TEMP}/issue-body.txt"
          gh issue create --title "${TITLE}" \
            --body-file "${RUNNER_TEMP}/issue-body.txt"
