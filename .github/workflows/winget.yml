name: Publish to winget

# winget cannot install a Python package. Its installer types are all real
# Windows artifacts (msi, msix, exe, zip, portable, font), so the winget
# package is a PyInstaller one-file build of anyvm.py, published as a release
# asset and pointed at by a portable manifest in microsoft/winget-pkgs.
#
# The manifest itself does NOT live in this repo -- unlike Homebrew, where the
# tap is our own repo, winget has exactly one community catalog and every
# manifest lives there. This workflow only produces the artifact that catalog
# points at, then asks for the manifest bump.
#
# Order matters: the winget validation pipeline downloads InstallerUrl and
# checks its SHA256, so the asset must be live on the release before the PR
# exists. Hence submit needs the exe job.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exe:
    runs-on: windows-latest
    permissions:
      # required to attach an asset to the release
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
          architecture: x64

      # --noupx even though the runners ship no UPX: compressed sections are a
      # well known antivirus heuristic trigger, and a Binary-Validation-Error
      # on the winget PR is the one failure mode that cannot be fixed by
      # editing the manifest.
      #
      # The hidden imports are the stdlib modules that nfsd.py (downloaded at
      # runtime for --sync nfs and executed via --internal-run-python) needs
      # and anyvm.py does not import itself. PyInstaller only bundles what it
      # can see from anyvm.py, so without these the frozen build would import-
      # error the moment someone asks for nfs. Keep in sync with the imports
      # in anyvm-org/nfsd.
      - name: Build anyvm-windows-x64.exe
        run: |
          python -m pip install --upgrade pyinstaller
          pyinstaller --onefile --console --noupx --clean --name anyvm-windows-x64 `
            --hidden-import argparse `
            --hidden-import ctypes `
            --hidden-import ctypes.util `
            --hidden-import errno `
            --hidden-import logging `
            --hidden-import socketserver `
            --hidden-import stat `
            anyvm.py

      # Proves the freeze actually produced a working program before it is
      # attached to a release that winget will then hash and advertise.
      - name: Smoke test the exe
        run: |
          $out = & .\dist\anyvm-windows-x64.exe --help 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0) { throw "--help exited $LASTEXITCODE" }
          if ($out -notmatch '--os') { throw "--help output does not mention --os" }
          Write-Host "--help ok"

      # The frozen build runs nfsd.py inside itself rather than shelling out to
      # a python that may not exist (python_argv). That path is only reachable
      # with --sync nfs against a real guest, so exercise it here with a stub
      # that imports exactly what nfsd.py imports: if a --hidden-import above
      # is missing, this fails at build time instead of on a user's machine.
      - name: Smoke test the in-process script runner
        run: |
          $probe = "import argparse, ctypes, ctypes.util, errno, logging, socketserver, stat, sys" + [Environment]::NewLine + "print('frozen-run-ok', sys.argv[1])"
          Set-Content -Path probe.py -Value $probe -Encoding ascii
          $out = & .\dist\anyvm-windows-x64.exe --internal-run-python probe.py hello 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0) { throw "--internal-run-python exited $LASTEXITCODE : $out" }
          if ($out -notmatch 'frozen-run-ok hello') { throw "--internal-run-python failed: $out" }
          Write-Host "script runner ok"

      # Also kept as a workflow artifact so a workflow_dispatch run gives you a
      # binary to test (and a file to hash) without cutting a release.
      - uses: actions/upload-artifact@v7
        with:
          name: anyvm-windows-x64
          path: dist/anyvm-windows-x64.exe

      - name: Upload anyvm-windows-x64.exe Release Asset
        # Gate on the event, not github.ref: for a 'release' event github.ref
        # is not guaranteed to be refs/tags/<tag> -- it can come through as
        # refs/heads/<target_commitish>, silently skipping the upload.
        # Same reasoning as release-asset.yml.
        if: "github.event_name == 'release' || startsWith(github.ref, 'refs/tags/')"
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.event.release.tag_name || github.ref_name }}
          files: dist/anyvm-windows-x64.exe

  submit:
    needs: exe
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    env:
      WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
    steps:
      # winget-releaser can only UPDATE a package that already exists in
      # microsoft/winget-pkgs; the very first version has to be a hand-made PR.
      # Leaving WINGET_TOKEN unset therefore keeps this job dormant (green,
      # skipped) until that first PR is merged, instead of failing every
      # release until then.
      - name: Decide whether to submit
        id: gate
        run: |
          if [ -z "${WINGET_TOKEN}" ]; then
            echo "WINGET_TOKEN is not set -- skipping the winget-pkgs PR"
            echo "go=no" >> "$GITHUB_OUTPUT"
          else
            echo "go=yes" >> "$GITHUB_OUTPUT"
          fi

      # komac refuses to branch off a fork that has fallen behind upstream,
      # and reports it as a PERMISSION error rather than a staleness one:
      #
      #   <user> does not have the correct permissions to execute `CreateRef`
      #   failed to create branch anyvm-org.anyvm-<version>-<uuid>
      #
      # winget-pkgs takes hundreds of commits a day, so the fork is stale
      # again within hours of every release -- this is not an edge case, it
      # is the steady state. Sync it here rather than relying on the Pull app
      # (a third-party App on its own schedule, so it still leaves a window).
      # See vedantmgoyal9/winget-releaser#319 and russellbanks/Komac#1142;
      # note that komac's own `komac sync` reports success WITHOUT syncing,
      # which is why this uses gh instead.
      - name: Sync the winget-pkgs fork
        if: steps.gate.outputs.go == 'yes'
        env:
          GH_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: gh repo sync anyvm-org/winget-pkgs --source microsoft/winget-pkgs --branch master

      # version defaults to the release tag minus its leading v, which is
      # exactly the PackageVersion the manifests use (v0.5.7 -> 0.5.7).
      #
      # fork-user is the account holding the winget-pkgs fork the PR branch is
      # pushed to -- anyvm-org/winget-pkgs, not a personal fork. WINGET_TOKEN
      # must therefore be able to push there, and must be a CLASSIC PAT with
      # the public_repo scope: a fine-grained token cannot push to the fork.
      - name: Submit to winget-pkgs
        if: steps.gate.outputs.go == 'yes'
        uses: vedantmgoyal9/winget-releaser@v2
        with:
          identifier: anyvm-org.anyvm
          installers-regex: 'anyvm-windows-.*\.exe$'
          fork-user: anyvm-org
          token: ${{ secrets.WINGET_TOKEN }}
