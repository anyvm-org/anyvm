
name: NetBSD

on:
  workflow_dispatch:
  push:
    branches:
      - '*'
    paths:
      - '**.py'
      - '.github/workflows/netbsd.yml'
      - '.github/workflows/testrun.yml'



concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Releases anyvm can fetch and run: 9.0 / 9.1 / 9.2 / 9.3 / 9.4 / 10.0 / 10.1 /
# 11.0 from anyvm-org/netbsd-builder. aarch64 ships for every release (9.0+);
# riscv64 only on 11.0; 11.0-microvm is the x86_64 fast-boot variant (see the
# testmicrovm job below).
# Sync: x86_64 / aarch64 / riscv64 run every backend (sshfs uses NetBSD's
# base mount_psshfs; nfs is the user-space nfsd via its port-111 portmapper,
# bound with sudo on the runner; sys-nfs the host kernel server).
# sparc64 (QEMU sun4u, TCG): all three releases (10.0 / 10.1 / 11.0) ship the
# classic single-IDE-disk image and run on the patched QEMU that anyvm pins for
# this arch -- the sabre IRQ-clobber fix, which is what actually cured the
# CMD646 lost-interrupt wedge (the wedge is a QEMU host-bridge bug, not a guest
# or disk-controller one). All three are therefore tested below. rsync is
# covered on 10.0 / 10.1 -- its old "not stable" verdict dates from the wedge
# era -- but 11.0 has no rsync binary at all (pkgsrc ships only a 10.0-linked
# one), so that one combination is excluded.
jobs:
  test:
    if: >-
      ${{ github.event_name != 'push'
          || (
               ( !contains(github.event.head_commit.message, '[testos=')
                 || contains(github.event.head_commit.message, '[testos=netbsd]') )
            && ( !contains(github.event.head_commit.message, '[testhost=')
                 || contains(github.event.head_commit.message, '[testhost=linux') )
             ) }}
    strategy:
      fail-fast: false
      matrix:
        release: ["9.0", "9.1", "9.2", "9.3", "9.4", "10.0", "10.1", "11.0"]
        arch: ["aarch64", ""]
        runs: ["ubuntu-24.04"]
        sync: ["sshfs", "nfs", "sys-nfs", "scp", "rsync", "tar"]

    uses: ./.github/workflows/testrun.yml
    secrets: inherit
    with:
      runs: ${{ matrix.runs }}
      os: netbsd
      release: ${{ matrix.release }}
      arch: ${{ matrix.arch }}
      sync: ${{ matrix.sync }}


  # aarch64 on a NATIVE ARM host (ubuntu-24.04-arm). GitHub's arm64 runners
  # have no /dev/kvm, so QEMU still runs under TCG -- but TCG on an aarch64 host
  # is a different code path than aarch64-guest-on-x86-host (the `test` job
  # above), and some guest / CPU-model combinations only misbehave there (e.g.
  # NetBSD 10.x under -cpu max). Exercising it here keeps that path covered at
  # the source instead of only catching regressions downstream in the *-vm
  # action repos. aarch64 only -- there is no point running the x86_64 guest on
  # an ARM host.
  testarm:
    if: >-
      ${{ github.event_name != 'push'
          || (
               ( !contains(github.event.head_commit.message, '[testos=')
                 || contains(github.event.head_commit.message, '[testos=netbsd]') )
            && ( !contains(github.event.head_commit.message, '[testhost=')
                 || contains(github.event.head_commit.message, '[testhost=linux') )
             ) }}
    strategy:
      fail-fast: false
      matrix:
        release: ["9.0", "9.1", "9.2", "9.3", "9.4", "10.0", "10.1", "11.0"]
        arch: ["aarch64"]
        runs: ["ubuntu-24.04-arm"]
        sync: ["sshfs", "nfs", "sys-nfs", "scp", "rsync", "tar"]

    uses: ./.github/workflows/testrun.yml
    secrets: inherit
    with:
      runs: ${{ matrix.runs }}
      os: netbsd
      release: ${{ matrix.release }}
      arch: ${{ matrix.arch }}
      sync: ${{ matrix.sync }}

  # 11.0-microvm: the fast-boot VARIANT of 11.0 (QEMU microvm machine,
  # official MICROVM kernel booted directly via -kernel; no BIOS/PCI/ACPI,
  # virtio over MMIO). Boot-to-ssh ~4x faster than the pc machine. No nfs /
  # sys-nfs legs: both need the guest kernel's NFS client, which the MICROVM
  # kernel does not have (no built-in NFS and the GENERIC nfs.kmod refuses
  # to load into it -- "Exec format error"). sshfs works (puffs is built
  # in); rsync/scp/tar ride plain ssh. Linux only for now: microvm under
  # WHPX / HVF is unverified, so testwindows/testmacos exclude it.
  testmicrovm:
    if: >-
      ${{ github.event_name != 'push'
          || (
               ( !contains(github.event.head_commit.message, '[testos=')
                 || contains(github.event.head_commit.message, '[testos=netbsd]') )
            && ( !contains(github.event.head_commit.message, '[testhost=')
                 || contains(github.event.head_commit.message, '[testhost=linux') )
             ) }}
    strategy:
      fail-fast: false
      matrix:
        release: ["11.0-microvm"]
        arch: [""]
        runs: ["ubuntu-24.04"]
        sync: ["sshfs", "scp", "rsync", "tar"]

    uses: ./.github/workflows/testrun.yml
    secrets: inherit
    with:
      runs: ${{ matrix.runs }}
      os: netbsd
      release: ${{ matrix.release }}
      arch: ${{ matrix.arch }}
      sync: ${{ matrix.sync }}

  # riscv64 (QEMU virt + u-boot/EDK2) ships only for 11.0 -- the riscv port
  # does not exist on the netbsd-9 / netbsd-10 branches.
  testriscv64:
    if: >-
      ${{ github.event_name != 'push'
          || (
               ( !contains(github.event.head_commit.message, '[testos=')
                 || contains(github.event.head_commit.message, '[testos=netbsd]') )
            && ( !contains(github.event.head_commit.message, '[testhost=')
                 || contains(github.event.head_commit.message, '[testhost=linux') )
             ) }}
    strategy:
      fail-fast: false
      matrix:
        release: ["11.0"]
        arch: ["riscv64"]
        runs: ["ubuntu-24.04"]
        sync: ["sshfs", "nfs", "sys-nfs", "scp", "rsync", "tar"]

    uses: ./.github/workflows/testrun.yml
    secrets: inherit
    with:
      runs: ${{ matrix.runs }}
      os: netbsd
      release: ${{ matrix.release }}
      arch: ${{ matrix.arch }}
      sync: ${{ matrix.sync }}

  # sparc64 (QEMU sun4u, TCG, single-disk image, builder >= v2.1.5): every
  # release now ships on the patched QEMU (the sabre IRQ-clobber fix), so the
  # CMD646 "lost interrupt" wedge that used to keep sparc64 out of CI is gone
  # for all of 10.0 / 10.1 / 11.0 -- exercise the full sync matrix on each.
  # rsync runs on 10.0 / 10.1 only. 11.0 sparc64 ships WITHOUT the rsync binary
  # on purpose: pkgsrc only has a sparc64 rsync built against 10.0's
  # libcrypto.so.15, which hard-fails to install on 11.0's newer OpenSSL, so
  # netbsd-11.0-sparc64.conf sets VM_RSYNC_PKG="". Restore the combination here
  # once native sparc64/11.0 packages exist (see that conf for the trigger).
  testsparc64:
    if: >-
      ${{ github.event_name != 'push'
          || (
               ( !contains(github.event.head_commit.message, '[testos=')
                 || contains(github.event.head_commit.message, '[testos=netbsd]') )
            && ( !contains(github.event.head_commit.message, '[testhost=')
                 || contains(github.event.head_commit.message, '[testhost=linux') )
             ) }}
    strategy:
      fail-fast: false
      matrix:
        release: ["10.0", "10.1", "11.0"]
        arch: ["sparc64"]
        runs: ["ubuntu-24.04"]
        sync: ["sshfs", "nfs", "sys-nfs", "scp", "rsync", "tar"]
        exclude:
          - release: "11.0"
            sync: "rsync"

    uses: ./.github/workflows/testrun.yml
    secrets: inherit
    with:
      runs: ${{ matrix.runs }}
      os: netbsd
      release: ${{ matrix.release }}
      arch: ${{ matrix.arch }}
      sync: ${{ matrix.sync }}
