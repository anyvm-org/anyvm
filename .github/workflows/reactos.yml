name: ReactOS

on:
  workflow_dispatch:
  push:
    branches:
      - '*'
    paths:
      - '**.py'
      - '.github/workflows/reactos.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ReactOS ships no remote-access server at all, so reactos-builder bakes its
# own small Win32 telnet server (anyvmtd) into the image and anyvm drives the
# guest over it -- the same telnet transport plan9 uses, and the same reason
# neither can reuse the ssh-based testrun.yml.
#
# Unlike plan9's 9P share, the ReactOS folder sync (--sync tar) is a ustar
# stream over that very telnet channel, so it needs nothing from the host
# kernel. This job verifies BOTH channels:
#   1. exec: run `echo` in the guest (cmd.exe) and read the marker back
#   2. tar sync: a host file placed via `--sync tar -v` shows up in the guest
#
# Measured boot-to-telnet, same image: 18 s with KVM here, 35 s under WHPX on
# a Windows host, 68 s under pure TCG. The macOS and Windows legs live in
# testmacos.yml / testwindows.yml. (They were briefly deleted as impossible
# when both timed out -- the cause turned out to be anyvm passing
# -rtc driftfix=slew, which zeroes this guest's HAL stall calibration on any
# host without full hardware virtualisation.)
jobs:
  test:
    if: >-
      ${{ github.event_name != 'push'
          || (
               ( !contains(github.event.head_commit.message, '[testos=')
                 || contains(github.event.head_commit.message, '[testos=reactos]') )
            && ( !contains(github.event.head_commit.message, '[testhost=')
                 || contains(github.event.head_commit.message, '[testhost=linux') )
             ) }}
    strategy:
      fail-fast: false
      matrix:
        release: ["0.4.15"]
        arch: ["i386"]
        runs: ["ubuntu-24.04"]
    runs-on: ${{ matrix.runs }}
    name: Test ${{ matrix.release }} ${{ matrix.arch }}
    # With KVM the guest is up in well under a minute; this only stops a
    # wedged boot from burning the 6 h default.
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
    steps:
    - uses: actions/checkout@v7
    - name: Install dependencies
      run: |
        sudo apt-get --no-install-recommends -y install \
          zstd qemu-utils qemu-system-x86 ca-certificates
        # The runner HAS /dev/kvm but not write access to it, so anyvm logs
        # "exists but is not writable" and falls back to TCG -- under which
        # ReactOS did not get past early kernel init in 600 s (run
        # 31238792386). Same one-liner testrun.yml already uses.
        sudo chmod 666 /dev/kvm || true
    - name: Boot ReactOS and verify telnet exec + tar sync
      shell: bash
      run: |
        set -e
        mountdir=test
        mkdir -p ${mountdir}
        echo "anyvm" > ${mountdir}/justcheck.txt
        # A REAL payload, not one file. Every count-dependent defect this
        # transport has had was invisible at toy scale and only appeared once
        # a genuine workspace went through: the agent dropping bytes on a full
        # pipe, the pull's flat silence budget expiring before the guest's
        # directory walk produced its first byte, harness files nobody
        # excluded. One file exercises none of that, so this job ships 500
        # files plus a 1.0 MB blob and checksums the whole tree back at the
        # end. Keep it: a green run over a single file proves very little.
        for i in $(seq 1 500); do
          head -c 2048 /dev/urandom | base64 > ${mountdir}/f$i.txt
        done
        head -c 1000000 /dev/urandom > ${mountdir}/blob.bin
        ( cd ${mountdir} && find . -type f | sort | xargs md5sum ) > /tmp/manifest.before
        echo "payload: $(find ${mountdir} -type f | wc -l) files, $(du -sk ${mountdir} | cut -f1) KB"
        mkdir -p ../test_output
        # Boot detached: anyvm returns leaving QEMU running, after wiring the
        # telnet control forward (host 10023 -> guest 23) and pushing the
        # shared folder into the guest as a ustar stream over that channel.
        # --arch comes from the matrix rather than anyvm's reactos i386
        # default, because the coverage checker reads the release/arch pair
        # off this matrix; test.yml's reactos job exercises the default.
        # --boot-timeout-sec: pure headroom. With KVM this boots in ~18 s;
        # the raised bound only keeps a slow or contended runner from
        # tripping the 600 s default.
        python anyvm.py --debug --data-dir ../test_output --os reactos \
          --release "${{ matrix.release }}" --arch "${{ matrix.arch }}" \
          --ssh-port 10023 -d --boot-timeout-sec 1500 \
          --sync tar -v "${mountdir}:C:\work"
        echo "===============verify telnet exec + tar-synced marker"
        python3 - <<'PY'
        import socket, sys, time
        def telnet_exec(port, cmds, settle=4.0):
            IAC=255; SE=240; SB=250; WILL,WONT,DO,DONT=251,252,253,254
            out=bytearray()
            s=socket.create_connection(("127.0.0.1",port),15)
            def eat(data):
                i=0;n=len(data)
                while i<n:
                    b=data[i]
                    if b!=IAC: out.append(b); i+=1; continue
                    if i+1>=n: break
                    c=data[i+1]
                    if c in (DO,DONT,WILL,WONT) and i+2<n:
                        o=data[i+2]
                        if c==DO: s.sendall(bytes([IAC,WONT,o]))
                        elif c==WILL: s.sendall(bytes([IAC,DONT,o]))
                        i+=3
                    elif c==SB:
                        j=i+2
                        while j+1<n and not (data[j]==IAC and data[j+1]==SE): j+=1
                        i=j+2
                    else: i+=2
            def rd(sec):
                end=time.time()+sec; s.settimeout(0.5)
                while time.time()<end:
                    try: d=s.recv(4096)
                    except socket.timeout: continue
                    if not d: return
                    eat(d)
            rd(min(settle,2))
            for c in cmds:
                s.sendall(c.encode()+b"\r\n"); rd(settle)
            s.close(); return out.decode("utf-8","replace")
        # The far side is cmd.exe: "^" escapes the next character, so the
        # command line echoed back reads EXEC^-OK while its OUTPUT is the
        # bare marker -- the assert cannot pass on the echo alone.
        txt=""
        for _ in range(20):
            try:
                txt=telnet_exec(10023, ["echo EXEC^-OK", "dir C:\\work"])
                if "EXEC-OK" in txt: break
            except OSError: time.sleep(3)
        print(txt)
        assert "EXEC-OK" in txt, "telnet exec failed"
        assert "justcheck.txt" in txt, "tar-synced file not visible in guest"
        print("reactos verify OK: telnet exec + tar sync")
        PY
    - name: Verify --attach exec status + pull
      shell: bash
      run: |
        set -e
        # Succeeding guest command -> anyvm exits 0 (set -e enforces it).
        python anyvm.py --debug --os reactos --attach --ssh-port 10023 --exec-timeout-sec 120 -- "ver"
        # Failing guest command -> anyvm must exit nonzero. `type` on a
        # missing file, NOT `dir` on a missing path: probed against a live
        # 0.4.15 guest (2026-08-15), ReactOS's cmd does not set errorlevel
        # for a failed `dir` or `del` (both come back 0), while `type`,
        # `copy`, unknown commands and `cmd /c exit 1` all report 1.
        if python anyvm.py --debug --os reactos --attach --ssh-port 10023 --exec-timeout-sec 120 -- "type C:\no\such\file.txt"; then
          echo "FAIL: failing guest command reported success"; exit 1
        fi
        # Pull: a file created in the guest must reach the host tree.
        python anyvm.py --debug --os reactos --attach --ssh-port 10023 --exec-timeout-sec 120 -- "echo pulled> C:\work\fromguest.txt"
        python anyvm.py --debug --os reactos --attach --ssh-port 10023 --exec-timeout-sec 120 --pull-files -v "test:C:\work"
        grep -q pulled test/fromguest.txt
        echo "reactos --attach exec status + pull OK"
    - name: Verify the real payload survived the round trip
      shell: bash
      run: |
        set -e
        # Compare CONTENT hashes as a set, not a name-by-name diff, for two
        # reasons: the steps above deliberately add a file inside the guest
        # (so the returned tree is a superset), and RISC OS swaps '.' and '/'
        # in leafnames, so a name-based comparison would fail there for a
        # correct transfer. Every hash that went in must still be present --
        # that is what catches a truncated or misaligned stream, which is how
        # the agent's partial-write bug looked from the outside: files that
        # exist and are wrong.
        ( cd test && find . -type f | sort | xargs md5sum )           | awk '{print $1}' | sort > /tmp/after.hashes
        awk '{print $1}' /tmp/manifest.before | sort > /tmp/before.hashes
        missing="$(comm -23 /tmp/before.hashes /tmp/after.hashes | wc -l)"
        echo "sent $(wc -l < /tmp/before.hashes) files, $missing did not come back intact"
        if [ "$missing" != "0" ]; then
          echo "FAIL: $missing of the pushed files are missing or corrupted after the round trip"
          exit 1
        fi
        echo "round trip OK"
