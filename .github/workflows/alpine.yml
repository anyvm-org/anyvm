
name: Alpine

on:
  workflow_dispatch:
  push:
    branches:
      - '*'
    paths:
      - '**.py'
      - '.github/workflows/alpine.yml'
      - '.github/workflows/testrun.yml'



concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Coverage tracks alpine-builder v2.0.0 (ALL_RELEASES = 3.23, 3.23-aarch64,
# 3.24, 3.24-aarch64). Built from Alpine's official cloud images (the
# cloudinit generic variant). Every conf's VM_SYNC_METHODS is
# rsync,scp,sshfs,nfs,tar (rsync + sshfs + nfs-utils pre-installed), so all
# five backends are exercised on both arches.
jobs:
  test:
    if: >-
      ${{ github.event_name != 'push'
          || (
               ( !contains(github.event.head_commit.message, '[testos=')
                 || contains(github.event.head_commit.message, '[testos=alpine]') )
            && ( !contains(github.event.head_commit.message, '[testhost=')
                 || contains(github.event.head_commit.message, '[testhost=linux') )
             ) }}
    strategy:
      fail-fast: false
      matrix:
        release: ["3.23", "3.24"]
        arch: ["", "aarch64"]
        runs: ["ubuntu-24.04"]
        sync: ["sshfs", "nfs", "scp", "rsync", "tar"]


    uses: ./.github/workflows/testrun.yml
    secrets: inherit
    with:
      runs: ${{ matrix.runs }}
      os: alpine
      release: ${{ matrix.release }}
      arch: ${{ matrix.arch }}
      sync: ${{ matrix.sync }}
