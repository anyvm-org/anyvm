
name: FreeBSD

on:
  workflow_dispatch:
  push:
    branches:
      - '*'
    paths:
      - '**.py'
      - '.github/workflows/freebsd.yml'
      - '.github/workflows/testrun.yml'



concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# All FreeBSD releases now ship from anyvm-org/freebsd-builder (>= v2.2.8, the
# DEFAULT_BUILDER_VERSIONS["freebsd"] pin in anyvm.py), which publishes the full
# 10.4 -> 15.1 matrix on x86_64 and 12.4 -> 15.1 on aarch64 / riscv64 /
# powerpc64. The old "current vs vmactions-legacy-fallback" split is gone --
# anyvm fetches every release from anyvm-org for builder >= 2.0.0. Sync
# support per the builder's verified table.md:
#   x86_64 / aarch64 (13.2+) -> rsync + scp + sshfs + nfs (image ships rsync +
#                               fusefs-sshfs); all four backends.
#   10.4 / 11.4 / 12.4 x86_64 -> all five backends. pkg.FreeBSD.org dropped
#                               the FreeBSD:10/11/12 repos, but builder
#                               v2.2.8 installs rsync + fusefs-sshfs from
#                               the preserved SGGS mirror (signed with
#                               FreeBSD's own key). x86_64 only: the mirror
#                               has no aarch64 tree. 10.x / 11.x images have
#                               no EFI system partition, so anyvm boots them
#                               via SeaBIOS; 10.x also runs on -cpu qemu64
#                               (mirrors the builder's VM_CPU_MODEL pin).
#   12.4 aarch64             -> nfs + scp + tar only (base-only image).
#   riscv64 (13.x / 14.x)    -> nfs + scp + tar (base only). No 12.4 (riscv64
#                               began at 13.0); no 13.4 (upstream qcow2 is a
#                               broken stub).
#   riscv64 (15.x)           -> all five backends. pkg.FreeBSD.org still has no
#                               riscv64 packages, but the image now installs
#                               rsync + fusefs-sshfs from the repository
#                               anyvm-org/freebsd-pkg-repo publishes for
#                               FreeBSD:15:riscv64.
#   powerpc64                -> nfs + scp (base only; no powerpc64 pkg repo). No
#                               12.4 (12.x panics under QEMU pseries -- needs
#                               16M large pages the host can't back).
jobs:
  # x86_64 + aarch64. Every release now has both arches. aarch64 runs on the
  # x86 runner (TCG) and the native arm runner; amd64 on the x86 runner only.
  test:
    if: >-
      ${{ github.event_name != 'push'
          || (
               ( !contains(github.event.head_commit.message, '[testos=')
                 || contains(github.event.head_commit.message, '[testos=freebsd]') )
            && ( !contains(github.event.head_commit.message, '[testhost=')
                 || contains(github.event.head_commit.message, '[testhost=linux') )
             ) }}
    strategy:
      fail-fast: false
      matrix:
        release: ["10.4", "11.4", "12.4", "13.2", "13.3", "13.4", "13.5", "14.0", "14.1", "14.2", "14.3", "14.4", "14.5", "15.0", "15.1"]
        arch: ["aarch64", ""]
        runs: ["ubuntu-26.04", "ubuntu-26.04-arm"]
        sync: ["sshfs", "nfs", "scp", "rsync", "tar"]
        exclude:
          - runs: ubuntu-26.04-arm
            arch: ""
          # 10.4 / 11.4 exist on x86_64 only (builder >= v2.2.8).
          - release: "10.4"
            arch: aarch64
          - release: "11.4"
            arch: aarch64
          # 12.4-aarch64 is base-only: the SGGS mirror that restored the
          # FreeBSD:12 packages for amd64 has no aarch64 tree, so no rsync
          # and no sshfs there (12.4 x86_64 has all five since v2.2.8).
          - release: "12.4"
            arch: aarch64
            sync: rsync
          - release: "12.4"
            arch: aarch64
            sync: sshfs


    uses: ./.github/workflows/testrun.yml
    secrets: inherit
    with:
      runs: ${{ matrix.runs }}
      os: freebsd
      release: ${{ matrix.release }}
      arch: ${{ matrix.arch }}
      sync: ${{ matrix.sync }}


  # riscv64: nfs + scp + tar everywhere, plus rsync + sshfs on 15.x (see the
  # include block). No 12.4 image (riscv64 began at 13.0); no 13.4 image
  # (upstream qcow2 is a broken stub). nfs needs the Linux-host NFS server
  # that testrun.yml sets up, so these stay on the Linux runner.
  testriscv64:
    if: >-
      ${{ github.event_name != 'push'
          || (
               ( !contains(github.event.head_commit.message, '[testos=')
                 || contains(github.event.head_commit.message, '[testos=freebsd]') )
            && ( !contains(github.event.head_commit.message, '[testhost=')
                 || contains(github.event.head_commit.message, '[testhost=linux') )
             ) }}
    strategy:
      fail-fast: false
      matrix:
        release: ["13.2", "13.3", "13.5", "14.0", "14.1", "14.2", "14.3", "14.4", "14.5", "15.0", "15.1"]
        arch: ["riscv64"]
        runs: ["ubuntu-26.04"]
        sync: ["nfs", "scp", "tar"]
        # 15.x riscv64 installs rsync and fusefs-sshfs from
        # anyvm-org/freebsd-pkg-repo (pkg.FreeBSD.org has no riscv64
        # packages), so those two releases have all five backends. The
        # older riscv64 images are still base-only.
        include:
          - release: "15.0"
            arch: riscv64
            runs: ubuntu-26.04
            sync: rsync
          - release: "15.0"
            arch: riscv64
            runs: ubuntu-26.04
            sync: sshfs
          - release: "15.1"
            arch: riscv64
            runs: ubuntu-26.04
            sync: rsync
          - release: "15.1"
            arch: riscv64
            runs: ubuntu-26.04
            sync: sshfs


    uses: ./.github/workflows/testrun.yml
    secrets: inherit
    with:
      runs: ${{ matrix.runs }}
      os: freebsd
      release: ${{ matrix.release }}
      arch: ${{ matrix.arch }}
      sync: ${{ matrix.sync }}


  # powerpc64: nfs + scp (base only). No 12.4 image (12.x panics under QEMU
  # pseries). nfs needs the Linux-host NFS server, so these stay on the Linux
  # runner.
  testpowerpc64:
    if: >-
      ${{ github.event_name != 'push'
          || (
               ( !contains(github.event.head_commit.message, '[testos=')
                 || contains(github.event.head_commit.message, '[testos=freebsd]') )
            && ( !contains(github.event.head_commit.message, '[testhost=')
                 || contains(github.event.head_commit.message, '[testhost=linux') )
             ) }}
    strategy:
      fail-fast: false
      matrix:
        release: ["13.2", "13.3", "13.4", "13.5", "14.0", "14.1", "14.2", "14.3", "14.4", "14.5", "15.0", "15.1"]
        arch: ["powerpc64"]
        runs: ["ubuntu-26.04"]
        sync: ["nfs", "scp", "tar"]


    uses: ./.github/workflows/testrun.yml
    secrets: inherit
    with:
      runs: ${{ matrix.runs }}
      os: freebsd
      release: ${{ matrix.release }}
      arch: ${{ matrix.arch }}
      sync: ${{ matrix.sync }}


  # powerpc64 is a fully-emulated (TCG) guest, so it doubles as a host-
  # portability smoke test on the non-Linux runners. nfs needs a Linux host
  # NFS server (set up only in testrun.yml's Linux path), so the cross-host
  # jobs stay on scp, which works over plain ssh on every host. A representative
  # release subset is enough for a host smoke -- not the full matrix.
  testpowerpc64-hosts:
    # Windows + macOS only; testrun.yml drops whichever of the two was not
    # selected.
    if: >-
      ${{ github.event_name != 'push'
          || (
               ( !contains(github.event.head_commit.message, '[testos=')
                 || contains(github.event.head_commit.message, '[testos=freebsd]') )
            && ( !contains(github.event.head_commit.message, '[testhost=')
                 || contains(github.event.head_commit.message, '[testhost=win')
                 || contains(github.event.head_commit.message, '[testhost=mac') )
             ) }}
    strategy:
      fail-fast: false
      matrix:
        release: [""]
        arch: ["powerpc64"]
        runs: ["windows-latest", "macos-latest"]
        sync: ["scp", "tar"]


    uses: ./.github/workflows/testrun.yml
    secrets: inherit
    with:
      runs: ${{ matrix.runs }}
      os: freebsd
      release: ${{ matrix.release }}
      arch: ${{ matrix.arch }}
      sync: ${{ matrix.sync }}
