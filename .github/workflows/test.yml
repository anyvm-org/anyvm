
name: Test

on:
  workflow_dispatch:
  push:
    branches:
      - '*'
    paths:
      - '**.py'
      - '.github/workflows/test.yml'
      - '.github/workflows/testrun.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testsync:
    # Guest filtering ([testos=...]) happens per-leg in testrun.yml -- the
    # os here is a matrix axis. This gate is the host half only.
    if: >-
      ${{ github.event_name != 'push'
          || !contains(github.event.head_commit.message, '[testhost=')
          || contains(github.event.head_commit.message, '[testhost=linux') }}
    strategy:
      fail-fast: false
      matrix:
        os: ["freebsd", "ghostbsd", "haiku", "midnightbsd", "nextbsd", "netbsd", "openbsd", "ubuntu", "openeuler", "hurd"]
        arch: ["aarch64", ""]
        runs: ["ubuntu-24.04"]
        sync: ["sshfs", "scp", "rsync"]
        exclude:
          - os: midnightbsd
            arch: aarch64
          - os: ghostbsd
            arch: aarch64
          # hurd-builder ships x86_64 + i386 only (no aarch64 port exists).
          - os: hurd
            arch: aarch64
          # The Hurd has no FUSE and the hurd archive has no sshfs package.
          - os: hurd
            sync: sshfs
          # NextBSD cannot load fusefs: the NEXTBSD kernel is built
          # NO_MODULES and the image ships no kldload (Darwin's kextload
          # replaces it and only loads kext bundles).
          - os: nextbsd
            sync: sshfs
          - os: haiku
            arch: aarch64
        include:
          # haiku is the one guest in these matrices that needs non-default
          # inputs, so they ride along as matrix data rather than as a
          # per-caller conditional. Its "/" is a rootfs that holds
          # directories and symlinks but NOT regular files, so a share under
          # the default /mnt/host takes every write with B_BAD_VALUE (scp
          # "dest open ...: Bad message", rsync "mkstemp ... failed: Invalid
          # Argument (-2147483643)") -- it has to land on the real BFS
          # volume. And the guest account is `user`; the default root cannot
          # log in at all, which is what testrun.yml's
          # `${{ inputs.user }}@localhost` check trips over. Every other os
          # leaves both unset and testrun.yml falls back to its documented
          # defaults. Matches what haiku.yml has always passed.
          - os: haiku
            user: user
            vmpath: /boot/home/host

    uses: ./.github/workflows/testrun.yml
    secrets: inherit
    with:
      runs: ${{ matrix.runs }}
      os: ${{ matrix.os }}
      arch: ${{ matrix.arch }}
      sync: ${{ matrix.sync }}
      user: ${{ matrix.user }}
      vmpath: ${{ matrix.vmpath }}


  # nextbsd is in this job (the bundled user-space nfsd) but deliberately NOT
  # in testsysnfs below: only the user-space path has been verified on it.
  testnfs:
    if: >-
      ${{ github.event_name != 'push'
          || !contains(github.event.head_commit.message, '[testhost=')
          || contains(github.event.head_commit.message, '[testhost=linux') }}
    strategy:
      fail-fast: false
      matrix:
        os: ["freebsd", "ghostbsd", "haiku", "midnightbsd", "nextbsd", "netbsd", "openbsd", "solaris", "dragonflybsd", "omnios", "openindiana", "tribblix", "ubuntu", "openeuler", "hurd"]
        arch: ["aarch64", ""]
        runs: ["ubuntu-24.04"]
        exclude:
          # x86_64-only images.
          - os: solaris
            arch: aarch64
          - os: dragonflybsd
            arch: aarch64
          - os: omnios
            arch: aarch64
          - os: openindiana
            arch: aarch64
          - os: tribblix
            arch: aarch64
          - os: midnightbsd
            arch: aarch64
          - os: ghostbsd
            arch: aarch64
          - os: hurd
            arch: aarch64
          - os: haiku
            arch: aarch64
        include:
          # haiku is the one guest in these matrices that needs non-default
          # inputs, so they ride along as matrix data rather than as a
          # per-caller conditional. Its "/" is a rootfs that holds
          # directories and symlinks but NOT regular files, so a share under
          # the default /mnt/host takes every write with B_BAD_VALUE (scp
          # "dest open ...: Bad message", rsync "mkstemp ... failed: Invalid
          # Argument (-2147483643)") -- it has to land on the real BFS
          # volume. And the guest account is `user`; the default root cannot
          # log in at all, which is what testrun.yml's
          # `${{ inputs.user }}@localhost` check trips over. Every other os
          # leaves both unset and testrun.yml falls back to its documented
          # defaults. Matches what haiku.yml has always passed.
          - os: haiku
            user: user
            vmpath: /boot/home/host


    uses: ./.github/workflows/testrun.yml
    secrets: inherit
    with:
      runs: ${{ matrix.runs }}
      os: ${{ matrix.os }}
      arch: ${{ matrix.arch }}
      sync: nfs
      user: ${{ matrix.user }}
      vmpath: ${{ matrix.vmpath }}


  # --sync tar is the one folder-sync backend that needs NOTHING in the guest
  # beyond a tar binary (in base on every guest listed here) and the
  # remote-exec channel that is already there: no rsync/sshfs package, no
  # /dev/fuse, no nfsd on the host. That is why every builder declares it, and
  # why this job gets testnfs's wide guest list rather than testsync's
  # narrower one -- the guests that cannot do rsync/sshfs can all do tar.
  #
  # It is also the only backend that is a one-shot COPY instead of a live
  # mount: anyvm pushes the tree in before the guest command and pulls it back
  # out after (sync_tar / sync_tar_pull), so this leg is the only thing that
  # exercises the copy-back half.
  #
  # The excludes are image-availability facts -- those guests ship x86_64
  # images only -- identical to testnfs's, and say nothing about tar.
  #
  # Deliberately absent: blissos and reactos both already exercise tar in
  # their own matrices (blissos.yml over 3 releases x 3 host platforms, and
  # the reactos job at the bottom of this file, over the telnet transport
  # rather than ssh). plan9 has no tar path in anyvm at all -- its guest tar
  # takes a different invocation and it syncs over 9P instead.
  testtar:
    if: >-
      ${{ github.event_name != 'push'
          || !contains(github.event.head_commit.message, '[testhost=')
          || contains(github.event.head_commit.message, '[testhost=linux') }}
    strategy:
      fail-fast: false
      matrix:
        os: ["freebsd", "ghostbsd", "haiku", "midnightbsd", "nextbsd", "netbsd", "openbsd", "solaris", "dragonflybsd", "omnios", "openindiana", "tribblix", "ubuntu", "openeuler", "hurd"]
        arch: ["aarch64", ""]
        runs: ["ubuntu-24.04"]
        exclude:
          # x86_64-only images.
          - os: solaris
            arch: aarch64
          - os: dragonflybsd
            arch: aarch64
          - os: omnios
            arch: aarch64
          - os: openindiana
            arch: aarch64
          - os: tribblix
            arch: aarch64
          - os: midnightbsd
            arch: aarch64
          - os: ghostbsd
            arch: aarch64
          - os: hurd
            arch: aarch64
          - os: haiku
            arch: aarch64
        include:
          # The same haiku overrides the other jobs in this file carry: its "/"
          # holds directories and symlinks but no regular files, so the share
          # has to land on the real BFS volume, and the guest account is
          # `user` -- the default root cannot log in at all.
          - os: haiku
            user: user
            vmpath: /boot/home/host

    uses: ./.github/workflows/testrun.yml
    secrets: inherit
    with:
      runs: ${{ matrix.runs }}
      os: ${{ matrix.os }}
      arch: ${{ matrix.arch }}
      sync: tar
      user: ${{ matrix.user }}
      vmpath: ${{ matrix.vmpath }}


  # Kept: the host kernel NFS server path (--sync sys-nfs), which is what
  # `sync: nfs` used to exercise before nfs switched to the bundled
  # user-space nfsd. hurd: /hurd/nfs is UDP-only; anyvm force-enables the
  # kernel nfsd UDP transport (rpc.nfsd --udp, needs sudo) and exports
  # with no_root_squash for hurd. Remaining unknown exercised by this
  # leg: whether the runner's rpc.mountd still answers MOUNT v1.
  testsysnfs:
    if: >-
      ${{ github.event_name != 'push'
          || !contains(github.event.head_commit.message, '[testhost=')
          || contains(github.event.head_commit.message, '[testhost=linux') }}
    strategy:
      fail-fast: false
      matrix:
        os: ["freebsd", "ghostbsd", "haiku", "midnightbsd", "netbsd", "openbsd", "solaris", "dragonflybsd", "omnios", "openindiana", "tribblix", "ubuntu", "openeuler", "hurd"]
        arch: ["aarch64", ""]
        runs: ["ubuntu-24.04"]
        exclude:
          - os: solaris
            arch: aarch64
          - os: dragonflybsd
            arch: aarch64
          - os: omnios
            arch: aarch64
          - os: openindiana
            arch: aarch64
          - os: tribblix
            arch: aarch64
          - os: midnightbsd
            arch: aarch64
          - os: ghostbsd
            arch: aarch64
          - os: hurd
            arch: aarch64
          - os: haiku
            arch: aarch64
        include:
          # haiku is the one guest in these matrices that needs non-default
          # inputs, so they ride along as matrix data rather than as a
          # per-caller conditional. Its "/" is a rootfs that holds
          # directories and symlinks but NOT regular files, so a share under
          # the default /mnt/host takes every write with B_BAD_VALUE (scp
          # "dest open ...: Bad message", rsync "mkstemp ... failed: Invalid
          # Argument (-2147483643)") -- it has to land on the real BFS
          # volume. And the guest account is `user`; the default root cannot
          # log in at all, which is what testrun.yml's
          # `${{ inputs.user }}@localhost` check trips over. Every other os
          # leaves both unset and testrun.yml falls back to its documented
          # defaults. Matches what haiku.yml has always passed.
          - os: haiku
            user: user
            vmpath: /boot/home/host


    uses: ./.github/workflows/testrun.yml
    secrets: inherit
    with:
      runs: ${{ matrix.runs }}
      os: ${{ matrix.os }}
      arch: ${{ matrix.arch }}
      sync: sys-nfs
      user: ${{ matrix.user }}
      vmpath: ${{ matrix.vmpath }}


  # Plan 9 (9front) has no sshd, so it cannot reuse the ssh-based
  # testrun.yml. Same standalone telnet-exec + 9P-sync verification as
  # plan9.yml, on the Linux host.
  plan9:
    if: >-
      ${{ github.event_name != 'push'
          || (
               ( !contains(github.event.head_commit.message, '[testos=')
                 || contains(github.event.head_commit.message, '[testos=plan9]') )
            && ( !contains(github.event.head_commit.message, '[testhost=')
                 || contains(github.event.head_commit.message, '[testhost=linux') )
             ) }}
    runs-on: ubuntu-24.04
    name: Test plan9 9p
    env:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
    steps:
    - uses: actions/checkout@v7
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get --no-install-recommends -y install \
          zstd qemu-utils qemu-system-x86 ca-certificates
    - name: Boot 9front and verify telnet exec + 9P sync
      shell: bash
      run: |
        set -e
        mountdir=test
        mkdir -p ${mountdir}
        echo "anyvm" > ${mountdir}/justcheck.txt
        mkdir -p ../test_output
        python anyvm.py --debug --data-dir ../test_output --os plan9 \
          --ssh-port 10023 -d \
          --sync 9p -v "${mountdir}:/usr/glenda/work"
        echo "===============verify telnet exec + 9P-synced marker"
        python3 - <<'PY'
        import socket, sys, time
        def telnet_exec(port, cmds, settle=4.0):
            IAC=255; SE=240; SB=250; WILL,WONT,DO,DONT=251,252,253,254
            out=bytearray()
            s=socket.create_connection(("127.0.0.1",port),15)
            def eat(data):
                i=0;n=len(data)
                while i<n:
                    b=data[i]
                    if b!=IAC: out.append(b); i+=1; continue
                    if i+1>=n: break
                    c=data[i+1]
                    if c in (DO,DONT,WILL,WONT) and i+2<n:
                        o=data[i+2]
                        if c==DO: s.sendall(bytes([IAC,WONT,o]))
                        elif c==WILL: s.sendall(bytes([IAC,DONT,o]))
                        i+=3
                    elif c==SB:
                        j=i+2
                        while j+1<n and not (data[j]==IAC and data[j+1]==SE): j+=1
                        i=j+2
                    else: i+=2
            def rd(sec):
                end=time.time()+sec; s.settimeout(0.5)
                while time.time()<end:
                    try: d=s.recv(4096)
                    except socket.timeout: continue
                    if not d: return
                    eat(d)
            rd(min(settle,2))
            for c in cmds:
                s.sendall(c.encode()+b"\r\n"); rd(settle)
            s.close(); return out.decode("utf-8","replace")
        txt=""
        for _ in range(20):
            try:
                txt=telnet_exec(10023, ["echo EXEC''-OK", "ls /usr/glenda/work"])
                if "EXEC-OK" in txt: break
            except OSError: time.sleep(3)
        print(txt)
        assert "EXEC-OK" in txt, "telnet exec failed"
        assert "justcheck.txt" in txt, "9P-synced file not visible in guest"
        print("plan9 verify OK: telnet exec + 9P sync")
        PY


  # ReactOS ships no remote-access server of any kind, so reactos-builder
  # bakes its own Win32 telnet server (anyvmtd) into the image: like plan9 it
  # cannot reuse the ssh-based testrun.yml. Same standalone telnet-exec +
  # tar-sync verification as reactos.yml, on the Linux host.
  reactos:
    if: >-
      ${{ github.event_name != 'push'
          || (
               ( !contains(github.event.head_commit.message, '[testos=')
                 || contains(github.event.head_commit.message, '[testos=reactos]') )
            && ( !contains(github.event.head_commit.message, '[testhost=')
                 || contains(github.event.head_commit.message, '[testhost=linux') )
             ) }}
    runs-on: ubuntu-24.04
    name: Test reactos tar
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
    steps:
    - uses: actions/checkout@v7
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get --no-install-recommends -y install \
          zstd qemu-utils qemu-system-x86 ca-certificates
        # /dev/kvm exists on the runner but is not writable, which drops
        # anyvm to TCG -- too slow for an NT kernel to finish booting inside
        # the 600 s window. testrun.yml does the same thing.
        sudo chmod 666 /dev/kvm || true
    - name: Boot ReactOS and verify telnet exec + tar sync
      shell: bash
      run: |
        set -e
        mountdir=test
        mkdir -p ${mountdir}
        echo "anyvm" > ${mountdir}/justcheck.txt
        mkdir -p ../test_output
        # No --arch on purpose: ReactOS is i386-only and anyvm defaults to it,
        # so this leg is what proves a bare `--os reactos` resolves an image
        # instead of dying in "Cannot find the image link" on an x86_64 host.
        # --boot-timeout-sec is headroom only: with KVM this reaches a telnet
        # prompt in ~18 s. (The 705 s that once justified this number came
        # from a run under nested KVM with -rtc driftfix=slew, which anyvm no
        # longer passes for reactos -- see the rtc block in anyvm.py.)
        python anyvm.py --debug --data-dir ../test_output --os reactos \
          --ssh-port 10023 -d --boot-timeout-sec 1500 \
          --sync tar -v "${mountdir}:C:\work"
        echo "===============verify telnet exec + tar-synced marker"
        python3 - <<'PY'
        import socket, sys, time
        def telnet_exec(port, cmds, settle=4.0):
            IAC=255; SE=240; SB=250; WILL,WONT,DO,DONT=251,252,253,254
            out=bytearray()
            s=socket.create_connection(("127.0.0.1",port),15)
            def eat(data):
                i=0;n=len(data)
                while i<n:
                    b=data[i]
                    if b!=IAC: out.append(b); i+=1; continue
                    if i+1>=n: break
                    c=data[i+1]
                    if c in (DO,DONT,WILL,WONT) and i+2<n:
                        o=data[i+2]
                        if c==DO: s.sendall(bytes([IAC,WONT,o]))
                        elif c==WILL: s.sendall(bytes([IAC,DONT,o]))
                        i+=3
                    elif c==SB:
                        j=i+2
                        while j+1<n and not (data[j]==IAC and data[j+1]==SE): j+=1
                        i=j+2
                    else: i+=2
            def rd(sec):
                end=time.time()+sec; s.settimeout(0.5)
                while time.time()<end:
                    try: d=s.recv(4096)
                    except socket.timeout: continue
                    if not d: return
                    eat(d)
            rd(min(settle,2))
            for c in cmds:
                s.sendall(c.encode()+b"\r\n"); rd(settle)
            s.close(); return out.decode("utf-8","replace")
        # cmd.exe on the far side: "^" escapes the next character, so the
        # echoed command line reads EXEC^-OK and only its OUTPUT is the bare
        # marker the assert looks for.
        txt=""
        for _ in range(20):
            try:
                txt=telnet_exec(10023, ["echo EXEC^-OK", "dir C:\\work"])
                if "EXEC-OK" in txt: break
            except OSError: time.sleep(3)
        print(txt)
        assert "EXEC-OK" in txt, "telnet exec failed"
        assert "justcheck.txt" in txt, "tar-synced file not visible in guest"
        print("reactos verify OK: telnet exec + tar sync")
        PY

  # RISC OS is the third guest with no remote-access server of its own, so
  # riscos-builder bakes in an agent and anyvm drives it over telnet -- same
  # standalone verification as riscos.yml, on the Linux host. Two things
  # differ from every other job in this file: there is no /dev/kvm step,
  # because raspi2b is a 32-bit ARM board model that QEMU implements under
  # TCG only, and the qemu-system-arm installed below is not what runs the
  # guest -- anyvm downloads a patched build from the builder release, since
  # no released QEMU can boot RISC OS on a raspi machine at all.
  riscos:
    if: >-
      ${{ github.event_name != 'push'
          || (
               ( !contains(github.event.head_commit.message, '[testos=')
                 || contains(github.event.head_commit.message, '[testos=riscos]') )
            && ( !contains(github.event.head_commit.message, '[testhost=')
                 || contains(github.event.head_commit.message, '[testhost=linux') )
             ) }}
    runs-on: ubuntu-24.04
    name: Test riscos tar
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
    steps:
    - uses: actions/checkout@v7
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get --no-install-recommends -y install \
          zstd qemu-utils qemu-system-arm ca-certificates
    - name: Boot RISC OS and verify telnet exec + tar sync
      shell: bash
      run: |
        set -e
        mountdir=test
        mkdir -p ${mountdir}
        echo "anyvm" > ${mountdir}/justcheck.txt
        mkdir -p ../test_output
        # No --arch on purpose: RISC OS is 32-bit ARM only and anyvm defaults
        # to armv7, so this leg is what proves a bare `--os riscos` resolves
        # an image instead of dying in "Cannot find the image link" on an
        # x86_64 host. Note armv7 is the only spelling that survives anyvm's
        # alias map -- "arm" is rewritten to aarch64.
        python anyvm.py --debug --data-dir ../test_output --os riscos \
          --ssh-port 10024 -d --boot-timeout-sec 2400 \
          --sync tar -v "${mountdir}:/work"
        echo "===============verify telnet exec + tar-synced marker"
        python3 - <<'PY'
        import socket, sys, time
        def telnet_exec(port, cmds, settle=6.0):
            IAC=255; SE=240; SB=250; WILL,WONT,DO,DONT=251,252,253,254
            out=bytearray()
            s=socket.create_connection(("127.0.0.1",port),15)
            def eat(data):
                i=0;n=len(data)
                while i<n:
                    b=data[i]
                    if b!=IAC: out.append(b); i+=1; continue
                    if i+1>=n: break
                    c=data[i+1]
                    if c in (DO,DONT,WILL,WONT) and i+2<n:
                        o=data[i+2]
                        if c==DO: s.sendall(bytes([IAC,WONT,o]))
                        elif c==WILL: s.sendall(bytes([IAC,DONT,o]))
                        i+=3
                    elif c==SB:
                        j=i+2
                        while j+1<n and not (data[j]==IAC and data[j+1]==SE): j+=1
                        i=j+2
                    else: i+=2
            def rd(sec):
                end=time.time()+sec; s.settimeout(0.5)
                while time.time()<end:
                    try: d=s.recv(4096)
                    except socket.timeout: continue
                    if not d: return
                    eat(d)
            rd(min(settle,2))
            for c in cmds:
                s.sendall(c.encode()+b"\r\n"); rd(settle)
            s.close(); return out.decode("utf-8","replace")
        # No escaping trick, unlike plan9's '' split and reactos's caret: the
        # far side is riscos-builder's agent, not a shell, and it never echoes
        # the command it was sent, so a bare marker cannot match its own line.
        txt=""
        for _ in range(20):
            try:
                txt=telnet_exec(10024, ["Echo EXEC-OK", "Cat $.work"])
                if "EXEC-OK" in txt: break
            except OSError: time.sleep(3)
        print(txt)
        assert "EXEC-OK" in txt, "telnet exec failed"
        # justcheck.txt here, justcheck/txt in the guest: RISC OS uses '.' as
        # its path separator and swaps '.' and '/' in leafnames. Match the
        # stem so the test does not depend on which side spells it.
        assert "justcheck" in txt, "tar-synced file not visible in guest"
        print("riscos verify OK: telnet exec + tar sync")
        PY

  # Redox is the fourth guest with no remote-access server of its own, so
  # redox-builder injects its own agent into the image offline and anyvm
  # drives it over telnet -- same standalone verification as redox.yml.
  # Unlike the riscos job above this one is entirely ordinary on the host
  # side: x86_64, so KVM applies and the stock qemu-system-x86 runs it.
  redox:
    if: >-
      ${{ github.event_name != 'push'
          || (
               ( !contains(github.event.head_commit.message, '[testos=')
                 || contains(github.event.head_commit.message, '[testos=redox]') )
            && ( !contains(github.event.head_commit.message, '[testhost=')
                 || contains(github.event.head_commit.message, '[testhost=linux') )
             ) }}
    runs-on: ubuntu-24.04
    name: Test redox tar
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
    steps:
    - uses: actions/checkout@v7
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get --no-install-recommends -y install \
          zstd qemu-utils qemu-system-x86 ca-certificates
        sudo chmod 666 /dev/kvm || true
    - name: Boot Redox and verify telnet exec + tar sync
      shell: bash
      run: |
        set -e
        mountdir=test
        mkdir -p ${mountdir}
        echo "anyvm" > ${mountdir}/justcheck.txt
        mkdir -p ../test_output
        # No --arch on purpose: 0.9.0 is the only release upstream ever cut
        # and it is x86_64-only, so this leg is what proves a bare
        # `--os redox` resolves an image on any host arch instead of dying in
        # "Cannot find the image link". redox.yml covers the explicit pair.
        # --boot-timeout-sec is headroom: with KVM the agent answers in ~9 s.
        python anyvm.py --debug --data-dir ../test_output --os redox \
          --ssh-port 10026 -d --boot-timeout-sec 900 \
          --sync tar -v "${mountdir}:/work"
        echo "===============verify telnet exec + tar-synced marker"
        python3 - <<'PY'
        import socket, sys, time
        def telnet_exec(port, cmds, settle=5.0):
            IAC=255; SE=240; SB=250; WILL,WONT,DO,DONT=251,252,253,254
            out=bytearray()
            s=socket.create_connection(("127.0.0.1",port),15)
            def eat(data):
                i=0;n=len(data)
                while i<n:
                    b=data[i]
                    if b!=IAC: out.append(b); i+=1; continue
                    if i+1>=n: break
                    c=data[i+1]
                    if c in (DO,DONT,WILL,WONT) and i+2<n:
                        o=data[i+2]
                        if c==DO: s.sendall(bytes([IAC,WONT,o]))
                        elif c==WILL: s.sendall(bytes([IAC,DONT,o]))
                        i+=3
                    elif c==SB:
                        j=i+2
                        while j+1<n and not (data[j]==IAC and data[j+1]==SE): j+=1
                        i=j+2
                    else: i+=2
            def rd(sec):
                end=time.time()+sec; s.settimeout(0.5)
                while time.time()<end:
                    try: d=s.recv(4096)
                    except socket.timeout: continue
                    if not d: return
                    eat(d)
            rd(min(settle,2))
            for c in cmds:
                s.sendall(c.encode()+b"\r\n"); rd(settle)
            s.close(); return out.decode("utf-8","replace")
        # ion collapses '' exactly like rc and sh, so the marker reassembles
        # in the output while the command line reads EXEC''-OK.
        txt=""
        for _ in range(20):
            try:
                txt=telnet_exec(10026, ["echo EXEC''-OK", "ls /work"])
                if "EXEC-OK" in txt: break
            except OSError: time.sleep(3)
        print(txt)
        assert "EXEC-OK" in txt, "telnet exec failed"
        assert "justcheck.txt" in txt, "tar-synced file not visible in guest"
        print("redox verify OK: telnet exec + tar sync")
        PY








      
      
      
