
name: Haiku

on:
  workflow_dispatch:
  push:
    branches:
      - '*'
    paths:
      - '**.py'
      - '.github/workflows/haiku.yml'
      - '.github/workflows/testrun.yml'


concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Coverage tracks haiku-builder v2.0.3 (ALL_RELEASES = r1beta6), x86_64 only.
# r1beta5 is still in that builder's releases.json but carries
# "build": false -- its conf stays so the already-published image keeps
# working, and it is deliberately not in this matrix.
# Sync backends are rsync + scp + nfs + sshfs + tar.
# nfs uses Haiku's in-kernel NFSv4.0 client (the nfs4 file system add-on,
# in the default image) against the bundled user-space nfsd:
# `mount -t nfs4 -p "server:/ port=N" dir`, TCP by default, port= honored
# (ParseArguments in src/add-ons/kernel/file_systems/nfs4/
# kernel_interface.cpp). Verified locally 2026-07-23 under QEMU/KVM:
# read + write-back, 4MB sha256 both directions, nonstandard port 2050.
# sshfs has no CLI on Haiku: sshfs_fuse (baked into the image) is a
# userlandfs FUSE add-on mounted via `mount -t userlandfs -p "sshfs <src>"`.
# The kernel's on-demand userlandfs_server launch is broken on r1beta5
# (runtime_loader tries to load the add-ons DIRECTORY as an ELF -> mount
# fails with "Bad port ID"), so anyvm's sync_sshfs haiku branch pre-starts
# `userlandfs_server sshfs` first; with that, the mount works. Verified
# locally 2026-07-23 on r1beta5: read + write-back, 4MB sha256 both
# directions. On r1beta6 the packages resolve from the live HaikuPorts
# repo (sshfs_fuse-2.10-1 + userland_fs-r1~beta6_hrev59866_79-1, local
# build 2026-08-27) -- but the MOUNT itself has not been retested there,
# so this run is what confirms it.
# The guest user is "user" and the share lands under /boot/home.
#
# This workflow is the Linux-host matrix (all four sync backends). The
# macOS / Windows host-portability legs live in testmacos.yml and
# testwindows.yml instead. History: 54949d5 put windows-latest +
# macos-latest into the runs axis here, and ad3ba42 ("unstable") pulled
# them back out nine days later -- the completed legs all passed (3-5 min
# on Windows, ~5 min on macOS) but some hung for hours before the run was
# cancelled, once for the full 6h job limit, always on macOS. Those guests
# run under TCG and boot slowly, so a pause is inserted between the ssh
# probes there.
jobs:
  test:
    if: >-
      ${{ github.event_name != 'push'
          || (
               ( !contains(github.event.head_commit.message, '[testos=')
                 || contains(github.event.head_commit.message, '[testos=haiku]') )
            && ( !contains(github.event.head_commit.message, '[testhost=')
                 || contains(github.event.head_commit.message, '[testhost=linux') )
             ) }}
    strategy:
      fail-fast: false
      matrix:
        release: [""]
        arch: [""]
        runs: ["ubuntu-24.04"]
        sync: ["rsync", "scp", "nfs", "sshfs", "tar"]


    uses: ./.github/workflows/testrun.yml
    secrets: inherit
    with:
      runs: ${{ matrix.runs }}
      os: haiku
      release: ${{ matrix.release }}
      arch: ${{ matrix.arch }}
      sync: ${{ matrix.sync }}
      user: user
      vmpath: /boot/home/host
      sleep: ${{ matrix.runs != 'ubuntu-24.04' && 'sleep 10;' || '' }}
