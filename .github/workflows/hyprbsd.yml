name: HyprBSD

on:
  workflow_dispatch:
  push:
    branches:
      - '*'
    paths:
      - '**.py'
      - '.github/workflows/hyprbsd.yml'
      - '.github/workflows/testrun.yml'



concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Coverage tracks hyprbsd-builder v2.0.0 (ALL_RELEASES = 15.1), amd64 only
# (HyprBSD builds no other arch). Release 15.1 is built from upstream's
# 15.1-rc3 ISO until the final 15.1 ISO is published; the release name does
# not change when it is. The conf's VM_SYNC_METHODS is
# rsync,scp,sshfs,nfs,tar (rsync ships with HyprBSD, fusefs-sshfs is
# pre-installed), so all five backends are exercised. The image boots
# through UEFI only, so anyvm starts it with OVMF (useefi, like freebsd).
jobs:
  test:
    if: >-
      ${{ github.event_name != 'push'
          || (
               ( !contains(github.event.head_commit.message, '[testos=')
                 || contains(github.event.head_commit.message, '[testos=hyprbsd]') )
            && ( !contains(github.event.head_commit.message, '[testhost=')
                 || contains(github.event.head_commit.message, '[testhost=linux') )
             ) }}
    strategy:
      fail-fast: false
      matrix:
        release: ["15.1"]
        arch: [""]
        runs: ["ubuntu-26.04"]
        sync: ["sshfs", "nfs", "scp", "rsync", "tar"]


    uses: ./.github/workflows/testrun.yml
    secrets: inherit
    with:
      runs: ${{ matrix.runs }}
      os: hyprbsd
      release: ${{ matrix.release }}
      arch: ${{ matrix.arch }}
      sync: ${{ matrix.sync }}
