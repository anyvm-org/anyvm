
name: MacOS

on:
  workflow_dispatch:
  push:
    branches:
      - '*'
    paths:
      - '**.py'
      - '.github/workflows/testmacos.yml'
      - '.github/workflows/testrun.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    # Guest filtering ([testos=...]) happens per-leg in testrun.yml -- the
    # os here is a matrix axis. This gate is the host half only.
    if: >-
      ${{ github.event_name != 'push'
          || !contains(github.event.head_commit.message, '[testhost=')
          || contains(github.event.head_commit.message, '[testhost=mac') }}
    strategy:
      fail-fast: false
      matrix:
        os: ["freebsd", "hardenedbsd", "opnsense", "ghostbsd", "haiku", "midnightbsd", "nextbsd", "netbsd", "openbsd", "solaris", "dragonflybsd", "omnios", "openindiana", "tribblix", "ubuntu", "debian", "openeuler", "alpine", "hurd"]
        arch: ["aarch64", "x86_64"]
        runs: ["macos-latest"]
        sync: ["scp", "rsync", "nfs", "tar"]
        exclude:
          - os: solaris
            arch: aarch64
          - os: dragonflybsd
            arch: aarch64
          - os: omnios
            arch: aarch64
          - os: openindiana
            arch: aarch64
          - os: tribblix
            arch: aarch64
          - os: midnightbsd
            arch: aarch64
          # ubuntu-builder v2.0.0 ships x86_64 only (no aarch64 image to fall
          # back to); x86_64 runs under TCG on the arm64 macOS runner.
          - os: ubuntu
            arch: aarch64
          # ghostbsd-builder v2.0.0 ships amd64 (x86_64) only.
          - os: ghostbsd
            arch: aarch64
          # hardenedbsd-builder ships amd64 (x86_64) only; it runs under TCG
          # on the arm64 macOS runner.
          - os: hardenedbsd
            arch: aarch64
          # opnsense-builder ships amd64 (x86_64) only; it runs under TCG on
          # the arm64 macOS runner.
          - os: opnsense
            arch: aarch64
          # hurd-builder ships x86_64 + i386 only (no aarch64 port exists);
          # x86_64 runs under TCG on the arm64 macOS runner.
          - os: hurd
            arch: aarch64
          # haiku-builder ships x86_64 only; it runs under TCG on the arm64
          # macOS runner.
          - os: haiku
            arch: aarch64
        include:
          # haiku needs non-default inputs, carried as matrix data the same
          # way test.yml does it: its "/" holds directories and symlinks but
          # NOT regular files, so the share has to land on the real BFS
          # volume, and the guest account is "user" (root cannot log in).
          # The sleep between ssh probes is already applied to every leg of
          # this workflow below.
          - os: haiku
            user: user
            vmpath: /boot/home/host
            # haiku is the leg that hangs here (three of them ran to the
            # 6-hour ceiling on 2026-08-07 and again on 2026-08-12), and it
            # is also one of the fastest when healthy: 5.0 min was the
            # slowest successful macOS haiku leg measured, and the hang shows
            # itself within ~3 min. 10 gives 2x that and keeps a bad round to
            # half an hour of runner time instead of eighteen.
            timeout: 10


    uses: ./.github/workflows/testrun.yml
    secrets: inherit
    with:
      runs: ${{ matrix.runs }}
      os: ${{ matrix.os }}
      arch: ${{ matrix.arch }}
      sync: ${{ matrix.sync }}
      user: ${{ matrix.user }}
      vmpath: ${{ matrix.vmpath }}
      sleep: "sleep 10;"
      # Per-guest, because one number cannot fit this matrix. 45 is the
      # default here rather than the shared 90: no macOS leg runs an emulated
      # slow arch, so the TCG boot headroom is not needed, and the inline jobs
      # further down this file already cap at 40. It cannot go lower as a
      # blanket value -- of 79 successful macOS legs measured, blissos 16 tar
      # took 23.0 min and solaris took 12.0 and 10.1, so a flat 10 would fail
      # three healthy legs. Guests that are reliably fast override it in the
      # matrix above instead.
      timeout: ${{ matrix.timeout || 45 }}


  # Plan 9 (9front) has no sshd, so it cannot reuse the ssh-based
  # testrun.yml. Verify boot + telnet exec; the x86_64 guest runs under TCG
  # on the arm64 macOS runner. NOTE: 9P folder sync is NOT tested here -- it
  # needs the Linux kernel v9fs client (mount -t 9p), which macOS does not
  # have, so a plan9 -v sync is a Linux-host-only feature. The full boot +
  # telnet + 9P-sync path is covered on Linux by plan9.yml.
  plan9:
    if: >-
      ${{ github.event_name != 'push'
          || (
               ( !contains(github.event.head_commit.message, '[testos=')
                 || contains(github.event.head_commit.message, '[testos=plan9]') )
            && ( !contains(github.event.head_commit.message, '[testhost=')
                 || contains(github.event.head_commit.message, '[testhost=mac') )
             ) }}
    runs-on: macos-latest
    name: Test plan9 telnet
    env:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
    steps:
    - uses: actions/checkout@v7
    - name: Install dependencies
      run: |
        brew untap aws/tap 2>/dev/null || true
        brew install qemu
    - name: Boot 9front and verify telnet exec
      shell: bash
      run: |
        set -e
        mkdir -p ../test_output
        python3 anyvm.py --debug --data-dir ../test_output --os plan9 \
          --ssh-port 10023 -d
        echo "===============verify telnet exec"
        python3 - <<'PY'
        import socket, sys, time
        def telnet_exec(port, cmds, settle=4.0):
            IAC=255; SE=240; SB=250; WILL,WONT,DO,DONT=251,252,253,254
            out=bytearray()
            s=socket.create_connection(("127.0.0.1",port),15)
            def eat(data):
                i=0;n=len(data)
                while i<n:
                    b=data[i]
                    if b!=IAC: out.append(b); i+=1; continue
                    if i+1>=n: break
                    c=data[i+1]
                    if c in (DO,DONT,WILL,WONT) and i+2<n:
                        o=data[i+2]
                        if c==DO: s.sendall(bytes([IAC,WONT,o]))
                        elif c==WILL: s.sendall(bytes([IAC,DONT,o]))
                        i+=3
                    elif c==SB:
                        j=i+2
                        while j+1<n and not (data[j]==IAC and data[j+1]==SE): j+=1
                        i=j+2
                    else: i+=2
            def rd(sec):
                end=time.time()+sec; s.settimeout(0.5)
                while time.time()<end:
                    try: d=s.recv(4096)
                    except socket.timeout: continue
                    if not d: return
                    eat(d)
            rd(min(settle,2))
            for c in cmds:
                s.sendall(c.encode()+b"\r\n"); rd(settle)
            s.close(); return out.decode("utf-8","replace")
        txt=""
        # TCG boot on the arm64 runner is slow; retry longer than on Linux.
        for _ in range(60):
            try:
                txt=telnet_exec(10023, ["echo EXEC''-OK", "cat /dev/user"])
                if "EXEC-OK" in txt: break
            except OSError: time.sleep(5)
        print(txt)
        assert "EXEC-OK" in txt, "telnet exec failed"
        print("plan9 verify OK: telnet exec (9P sync is Linux-only, see plan9.yml)")
        PY


  # ReactOS has no sshd either -- it is driven over the telnet server
  # reactos-builder bakes into the image, so it cannot reuse testrun.yml.
  # Unlike plan9, its folder sync IS tested here: --sync tar streams a ustar
  # archive over that same telnet channel, so it needs nothing from the host
  # kernel and must work from macOS exactly as it does from Linux. The i386
  # guest runs under TCG on the arm64 macOS runner.
  reactos:
    if: >-
      ${{ github.event_name != 'push'
          || (
               ( !contains(github.event.head_commit.message, '[testos=')
                 || contains(github.event.head_commit.message, '[testos=reactos]') )
            && ( !contains(github.event.head_commit.message, '[testhost=')
                 || contains(github.event.head_commit.message, '[testhost=mac') )
             ) }}
    runs-on: macos-latest
    name: Test reactos tar
    # HVF on the arm64 runner accelerates arm64 guests only, so this leg is
    # x86-on-ARM TCG -- the slowest host we test on. It only became possible
    # once anyvm stopped passing -rtc driftfix=slew for this guest (that made
    # the guest's HAL store StallScaleFactor = 0, so every busy-wait wrapped
    # to 2^32 iterations); pure TCG then boots it in 68 s on a fast x86 box.
    # Expect minutes here, not seconds -- hence the bound and the raised
    # --boot-timeout-sec below.
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
    steps:
    - uses: actions/checkout@v7
    - name: Install dependencies
      run: |
        brew untap aws/tap 2>/dev/null || true
        brew install qemu
    - name: Boot ReactOS and verify telnet exec + tar sync
      shell: bash
      run: |
        set -e
        mountdir=test
        mkdir -p ${mountdir}
        echo "anyvm" > ${mountdir}/justcheck.txt
        mkdir -p ../test_output
        python3 anyvm.py --debug --data-dir ../test_output --os reactos \
          --arch i386 --ssh-port 10023 -d --boot-timeout-sec 1500 \
          --sync tar -v "${mountdir}:C:\work"
        echo "===============verify telnet exec + tar-synced marker"
        python3 - <<'PY'
        import socket, sys, time
        def telnet_exec(port, cmds, settle=4.0):
            IAC=255; SE=240; SB=250; WILL,WONT,DO,DONT=251,252,253,254
            out=bytearray()
            s=socket.create_connection(("127.0.0.1",port),15)
            def eat(data):
                i=0;n=len(data)
                while i<n:
                    b=data[i]
                    if b!=IAC: out.append(b); i+=1; continue
                    if i+1>=n: break
                    c=data[i+1]
                    if c in (DO,DONT,WILL,WONT) and i+2<n:
                        o=data[i+2]
                        if c==DO: s.sendall(bytes([IAC,WONT,o]))
                        elif c==WILL: s.sendall(bytes([IAC,DONT,o]))
                        i+=3
                    elif c==SB:
                        j=i+2
                        while j+1<n and not (data[j]==IAC and data[j+1]==SE): j+=1
                        i=j+2
                    else: i+=2
            def rd(sec):
                end=time.time()+sec; s.settimeout(0.5)
                while time.time()<end:
                    try: d=s.recv(4096)
                    except socket.timeout: continue
                    if not d: return
                    eat(d)
            rd(min(settle,2))
            for c in cmds:
                s.sendall(c.encode()+b"\r\n"); rd(settle)
            s.close(); return out.decode("utf-8","replace")
        # cmd.exe on the far side: "^" escapes the next character, so only
        # the command's OUTPUT carries the bare marker.
        txt=""
        # TCG boot on the arm64 runner is slow; retry longer than on Linux.
        for _ in range(60):
            try:
                txt=telnet_exec(10023, ["echo EXEC^-OK", "dir C:\\work"])
                if "EXEC-OK" in txt: break
            except OSError: time.sleep(5)
        print(txt)
        assert "EXEC-OK" in txt, "telnet exec failed"
        assert "justcheck.txt" in txt, "tar-synced file not visible in guest"
        print("reactos verify OK: telnet exec + tar sync")
        PY
