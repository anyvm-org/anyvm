
name: DragonflyBSD

on:
  workflow_dispatch:
  push:
    branches:
      - '*'
    paths:
      - '**.py'
      - '.github/workflows/dragonflybsd.yml'
      - '.github/workflows/testrun.yml'


concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# x86_64 only. 6.4.1 / 6.4.2 are built by the current anyvm-org builder; 6.4.0
# is still downloadable from the older releases / the vmactions fallback. All
# three confs install rsync + fusefs-sshfs, so every backend is exercised
# (nfs = user-space nfsd via its port-111 portmapper, bound with sudo on the
# runner; sys-nfs = host kernel server).
jobs:
  test:
    if: >-
      ${{ github.event_name != 'push'
          || (
               ( !contains(github.event.head_commit.message, '[testos=')
                 || contains(github.event.head_commit.message, '[testos=dragonflybsd]') )
            && ( !contains(github.event.head_commit.message, '[testhost=')
                 || contains(github.event.head_commit.message, '[testhost=linux') )
             ) }}
    strategy:
      fail-fast: false
      matrix:
        release: ["6.4.0", "6.4.1", "6.4.2"]
        arch: [""]
        runs: ["ubuntu-26.04"]
        sync: ["sshfs", "nfs", "sys-nfs", "scp", "rsync", "tar"]


    uses: ./.github/workflows/testrun.yml
    secrets: inherit
    with:
      runs: ${{ matrix.runs }}
      os: dragonflybsd
      release: ${{ matrix.release }}
      arch: ${{ matrix.arch }}
      sync: ${{ matrix.sync }}
