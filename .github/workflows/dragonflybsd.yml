
name: DragonflyBSD

on:
  workflow_dispatch:
  push:
    branches:
      - '*'
    paths:
      - '**.py'
      - '.github/workflows/dragonflybsd.yml'
      - '.github/workflows/testrun.yml'


concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# x86_64 only. 6.4.1 / 6.4.2 are built by the current anyvm-org builder; 6.4.0
# is still downloadable from the older releases / the vmactions fallback.
# Every backend the builder offers is exercised (VM_SYNC_METHODS
# rsync,scp,nfs,tar; nfs = user-space nfsd via its port-111 portmapper, bound
# with sudo on the runner; sys-nfs = host kernel server). sshfs is not
# offered and not tested: DragonFly 6.4's kernel FUSE has write disabled
# (fuse_vop_write returns EOPNOTSUPP; only master has writes, 5d0d0bafbc),
# and libfuse >= 3.18 also hangs the mount -- it waits for mount_fusefs,
# which waits in the kernel for a FUSE_INIT reply the daemon is not reading
# yet (mount_fusefs: mount: Operation timed out after ~35 s).
jobs:
  test:
    if: >-
      ${{ github.event_name != 'push'
          || (
               ( !contains(github.event.head_commit.message, '[testos=')
                 || contains(github.event.head_commit.message, '[testos=dragonflybsd]') )
            && ( !contains(github.event.head_commit.message, '[testhost=')
                 || contains(github.event.head_commit.message, '[testhost=linux') )
             ) }}
    strategy:
      fail-fast: false
      matrix:
        release: ["6.4.0", "6.4.1", "6.4.2"]
        arch: [""]
        runs: ["ubuntu-26.04"]
        sync: ["nfs", "sys-nfs", "scp", "rsync", "tar"]


    uses: ./.github/workflows/testrun.yml
    secrets: inherit
    with:
      runs: ${{ matrix.runs }}
      os: dragonflybsd
      release: ${{ matrix.release }}
      arch: ${{ matrix.arch }}
      sync: ${{ matrix.sync }}
