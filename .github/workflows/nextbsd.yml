name: NextBSD

on:
  workflow_dispatch:
  push:
    branches:
      - '*'
    paths:
      - '**.py'
      - '.github/workflows/nextbsd.yml'
      - '.github/workflows/testrun.yml'



concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Coverage tracks nextbsd-builder (ALL_RELEASES = continuous,
# continuous-aarch64). NextBSD publishes no versioned releases: one rolling
# `continuous` tag is refreshed on every push to main, and each builder release
# tag freezes one of those snapshots. Upstream started publishing an arm64
# image next to amd64 on 2026-08-14; both come from the same snapshot.
#
# The conf's VM_SYNC_METHODS is rsync,scp,nfs. No sshfs leg: the NEXTBSD
# kernel is built NO_MODULES and the image ships no kldload, so fusefs cannot
# be loaded and there is no /dev/fuse. nfs only works because the builder
# bakes /etc/netconfig into the image (the curated /etc omits the RPC netid
# table, and without it every mount dies with "Netconfig database not found").
jobs:
  test:
    if: >-
      ${{ github.event_name != 'push'
          || (
               ( !contains(github.event.head_commit.message, '[testos=')
                 || contains(github.event.head_commit.message, '[testos=nextbsd]') )
            && ( !contains(github.event.head_commit.message, '[testhost=')
                 || contains(github.event.head_commit.message, '[testhost=linux') )
             ) }}
    strategy:
      fail-fast: false
      matrix:
        release: ["continuous"]
        arch: ["", "aarch64"]
        runs: ["ubuntu-24.04"]
        sync: ["scp", "rsync", "nfs", "tar"]


    uses: ./.github/workflows/testrun.yml
    secrets: inherit
    with:
      runs: ${{ matrix.runs }}
      os: nextbsd
      release: ${{ matrix.release }}
      arch: ${{ matrix.arch }}
      sync: ${{ matrix.sync }}
